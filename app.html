/* ============ VOICE: messages + soundboard ============ */
function mulawEnc(s){ let x=Math.round(Math.max(-1,Math.min(1,s))*32767); const sign=x<0?0x80:0; if(sign) x=-x; if(x>32635) x=32635; x+=0x84; let e=7; for(let m=0x4000;(x&m)===0&&e>0;e--,m>>=1); const man=(x>>(e+3))&0x0F; return (~(sign|(e<<4)|man))&0xFF; }
function mulawDec(u){ u=(~u)&0xFF; const sign=u&0x80, e=(u>>4)&7, man=u&0x0F; let x=((man<<3)+0x84)<<e; x-=0x84; return (sign?-x:x)/32768; }
function toB64(u8){ let s=""; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
async function encodeVoice(blob,maxSec=60){
  const c=ac(); if(!c) throw new Error("no audio");
  const ab=await blob.arrayBuffer();
  const buf=await new Promise((res,rej)=>{ const p=c.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); });
  const RATE=8000, sr=buf.sampleRate, dur=Math.min(maxSec,buf.duration), n=Math.floor(dur*RATE), ratio=sr/RATE;
  const chans=[]; for(let ch=0;ch<buf.numberOfChannels;ch++) chans.push(buf.getChannelData(ch));
  const out=new Float32Array(n); let peak=.01;
  for(let i=0;i<n;i++){ const a=Math.floor(i*ratio), z=Math.max(a+1,Math.floor((i+1)*ratio)); let sum=0,k=0; for(let j=a;j<z&&j<chans[0].length;j++){ for(const c of chans) sum+=c[j]; k+=chans.length; } const v=k?sum/k:0; out[i]=v; if(Math.abs(v)>peak) peak=Math.abs(v); }
  const gain=Math.min(5,.9/peak), u=new Uint8Array(n); for(let i=0;i<n;i++) u[i]=mulawEnc(out[i]*gain);
  // split into ≤20 s pieces so each fits in one stored document
  const CH=RATE*20, parts=[];
  for(let i=0;i<n;i+=CH){ const p=u.subarray(i,Math.min(n,i+CH)); parts.push({data:toB64(p),rate:RATE,dur:Math.max(1,Math.round(p.length/RATE))}); }
  if(!parts.length) throw new Error("empty");
  return parts;
}
const VCACHE={}; let VPLAY=null;
function pcmFrom(b64,rate){ const bin=atob(b64), n=bin.length, buf=AC.createBuffer(1,n,rate), ch=buf.getChannelData(0); for(let i=0;i<n;i++) ch[i]=mulawDec(bin.charCodeAt(i)); return buf; }
function playBuffer(buf,onEnd){ if(VPLAY){ try{VPLAY.stop()}catch(e){} } const s=AC.createBufferSource(); s.buffer=buf; s.connect(MASTER); s.onended=()=>{ if(VPLAY===s) VPLAY=null; onEnd&&onEnd(); }; s.start(); VPLAY=s; return s; }
function voiceBubble(m,light){
  let h=7; for(const c of String(m.vid)) h=(h*31+c.charCodeAt(0))%9973;
  let bars=""; for(let i=0;i<22;i++){ h=(h*17+11)%9973; bars+=`<i style="height:${5+h%18}px;animation-delay:${(i%6)*.08}s"></i>`; }
  return `<div class="vbub ${light?"light":""}"><button class="vplay" data-v="${esc(m.vid)}" onclick="playVoice(this)">▶</button><div class="wave" id="w_${esc(m.vid)}">${bars}</div><span class="vdur">0:${String(+m.dur||0).padStart(2,"0")}</span></div>`;
}
async function playVoice(btn){
  const vid=btn.dataset.v, w=document.getElementById("w_"+vid); if(!ac()) return;
  if(btn.textContent==="■"){ if(VPLAY) try{VPLAY.stop()}catch(e){} return; }
  btn.textContent="⏳";
  try{
    await loadVoice(vid);
    document.querySelectorAll(".vplay").forEach(b=>{ if(b.textContent==="■") b.textContent="▶"; }); document.querySelectorAll(".wave.play").forEach(x=>x.classList.remove("play"));
    btn.textContent="■"; w&&w.classList.add("play");
    playBuffer(VCACHE[vid],()=>{ btn.textContent="▶"; w&&w.classList.remove("play"); });
  }catch(e){ btn.textContent="▶"; toast("Voice message not found"); }
}
async function loadVoice(vid){ if(!VCACHE[vid]){ const s=await S.db.doc("voice/"+vid).get(); if(!s.exists) throw 0; const d=s.data(); VCACHE[vid]=pcmFrom(d.data,d.rate||8000); } return VCACHE[vid]; }

/* ---- auto-play: everyone in the room hears new voice clips in order ---- */
const VQ=[]; let vqBusy=false;
function queueVoice(m){ if(!S.sound) return; VQ.push(m); if(!vqBusy) nextVoice(); }
async function nextVoice(){
  const m=VQ.shift();
  if(!m){ vqBusy=false; setSpeaking(null); return; }
  vqBusy=true;
  if(!S.sound||!ac()){ VQ.length=0; vqBusy=false; setSpeaking(null); return; }
  try{
    const buf=await loadVoice(m.vid);
    setSpeaking(m.uid);
    const w=document.getElementById("w_"+m.vid); w&&w.classList.add("play");
    playBuffer(buf,()=>{ w&&w.classList.remove("play"); nextVoice(); });
  }catch(e){ nextVoice(); }
}
function setSpeaking(uid){

const MIC_BLOCKED_AT_START=(()=>{ try{ const pp=document.permissionsPolicy||document.featurePolicy; if(pp&&pp.allowsFeature&&!pp.allowsFeature("microphone")) return true; }catch(e){} return !(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder); })();
let micBlocked=MIC_BLOCKED_AT_START;
const TALK={rec:null,t0:0,timer:null,cancel:false,starting:false};
function setupTalk(){
  const b=$("#talkbtn"); if(!b) return;
  if(liveVoice()){ b.onpointerdown=null; b.onpointerup=null; b.onclick=()=>micToggle(); micUi(); return; }
  b.onpointerdown=null; b.onpointerup=null;
  b.onclick=()=>toast("🎙️ "+t("Live voice works on the website: dangi-kurdistan.vercel.app"));
}
async function talkStart(){
  if(S.cur&&isMutedIn(S.cur.data,S.uid)) return toast(t("You are muted in this room"));
  if(TALK.starting) return; TALK.starting=true;
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const chunks=[]; const rec=new MediaRecorder(st);
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); clearInterval(TALK.timer); $("#recbar")&&$("#recbar").classList.remove("show"); $("#talkbtn")&&$("#talkbtn").classList.remove("rec");
      const cancel=TALK.cancel; TALK.rec=null; renderSeats(); if(!cancel && chunks.length) sendTalkBlob(new Blob(chunks,{type:rec.mimeType})); };
    TALK.rec=rec; TALK.cancel=false; TALK.t0=Date.now(); rec.start(250);
    ensureSeat(); $("#talkbtn").classList.add("rec"); $("#recbar").classList.add("show"); renderSeats();
    TALK.timer=setInterval(()=>{ const s=Math.floor((Date.now()-TALK.t0)/1000), el=$("#rectime"); if(el) el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); if(s>=60) talkStop(true); },250);
  }catch(e){
    micBlocked=true;
    toast("🎤 This browser blocks the microphone here — tap 🎤 again to talk with your phone's recorder");
  }finally{ TALK.starting=false; }
}
function talkStop(send){ if(!TALK.rec) return; TALK.cancel=!send; try{ TALK.rec.stop(); }catch(e){} }
function talkFile(input){ const f=input.files&&input.files[0]; input.value=""; if(f&&S.cur&&isMutedIn(S.cur.data,S.uid)) return toast(t("You are muted in this room")); if(f){ ensureSeat(); sendTalkBlob(f); } }
function ensureSeat(){
  if(!S.cur) return; const ppl=roomPeople(), me=ppl.find(p=>p.uid===S.uid); if(me&&me.seat!=null) return;
  const taken=new Set(ppl.filter(p=>p.seat!=null).map(p=>p.seat));
  for(let i=1;i<MAX_SEATS;i++) if(!taken.has(i)&&!(S.cur.data.lockedSeats||[]).includes(i)) return takeSeat(i,true);
}
async function sendTalkBlob(blob){
  toast("📤 Sending your voice…");
  try{ const parts=await encodeVoice(blob,60); await sendVoice({kind:S.dm&&!S.cur?"dm":"room"},parts); }
  catch(e){ console.warn(e); toast("⚠️ Couldn't read that recording. Try mp3, m4a or wav."); }
}

function openRecorder(ctx){
  let rec=null, t0=0, timer=null, result=null;
  const dark=ctx.kind==="room";
  const draw=(state="idle",msg="")=>{
    const dur=result?result.reduce((a,p)=>a+p.dur,0):0;
    openModal(`${state==="ready"
      ? `<div class="center" style="margin:6px 0 14px"><div style="font-size:50px">🎧</div>Your voice message is ready (${dur}s)</div>
         <div class="row"><button class="gbtn dark" onclick="vrPreview()">▶ Listen</button><button class="gbtn" onclick="vrSend()">Send ➤</button><button class="gbtn dark" onclick="vrReset()">🗑️</button></div>`
      : state==="busy" ? `<div class="empty" style="padding:30px">${msg}</div>`
      : micBlocked ? `<div class="center" style="font-size:13px;margin:6px 0 4px">Record with your phone's voice recorder, or pick an audio file (up to 60 s).</div>`
      : `<button class="recbtn ${state==="rec"?"on":""}" onclick="vrToggle()">${state==="rec"?"⏹":"🎙️"}</button>
         <div class="center" style="margin-bottom:10px">${state==="rec"?`<b id="vrt">0/60</b> s — tap to stop`:"Tap to start recording (up to 60 s)"}</div>`}
      ${msg&&state!=="busy"?`<p style="font-size:12.5px;color:${dark?"#ffb3b3":"#b3261e"};text-align:center">${msg}</p>`:""}
      ${state==="ready"||state==="busy"||state==="rec"?"":`<label class="gbtn ${micBlocked?"":"dark"}" style="display:block;text-align:center;margin-top:10px;cursor:pointer;padding:12px">📱 Phone recorder / pick audio file<input type="file" accept="audio/*" capture style="display:none" onchange="vrFile(this.files[0])"></label>`}`,
      {title:"🎙️ Voice message",dark,onClose:()=>{ if(rec){ try{rec.stop()}catch(e){} } clearInterval(timer); }});
  };
  async function handle(blob){ draw("busy","⏳ Preparing audio..."); try{ result=await encodeVoice(blob,60); draw("ready"); }catch(e){ console.warn(e); draw("idle","⚠️ Couldn't read that file. Try mp3, m4a or wav."); } }
  window.vrToggle=async()=>{
    if(rec){ rec.stop(); return; }
    try{
      const st=await navigator.mediaDevices.getUserMedia({audio:true}); const chunks=[];
      rec=new MediaRecorder(st); rec.ondataavailable=e=>chunks.push(e.data);
      rec.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); clearInterval(timer); const r=rec; rec=null; handle(new Blob(chunks,{type:r.mimeType})); };
      rec.start(); t0=Date.now(); draw("rec");
      timer=setInterval(()=>{ const s=(Date.now()-t0)/1000, el=$("#vrt"); if(el) el.textContent=Math.floor(s)+"/60"; if(s>=60&&rec) rec.stop(); },250);
    }catch(e){ rec=null; micBlocked=true; draw("idle","⚠️ The microphone is blocked in this browser. Use the phone recorder button below."); }
  };
  window.vrFile=f=>{ if(f) handle(f); };
  window.vrPreview=()=>{ if(!ac()) return; let i=0; const go=()=>{ if(i<result.length) playBuffer(pcmFrom(result[i].data,result[i++].rate),go); }; go(); };
  window.vrReset=()=>{ result=null; draw(); };
  window.vrSend=async()=>{ const r=result; closeModal(); if(ctx.kind==="room") ensureSeat(); await sendVoice(ctx,r); };
  draw();
}
async function sendVoice(ctx,parts){
  if(!Array.isArray(parts)) parts=[parts];
  try{
    for(const r of parts){
      const vid=rid(), at=Date.now();
      await S.db.doc("voice/"+vid).set({data:r.data,rate:r.rate,dur:r.dur,uid:S.uid,at});
      if(ctx.kind==="room") { await postRoom({type:"voice",vid,dur:r.dur}); }
      else if(ctx.kind==="dm"&&S.dm){ await S.db.collection("dms/"+S.dm.key+"/msgs").add({uid:S.uid,type:"voice",vid,dur:r.dur,text:"",at}); await S.db.doc("dms/"+S.dm.key).set({members:[S.uid,S.dm.other],last:"🎙️ Voice message",at,by:S.uid}); }
    }
    if(ctx.kind==="room") bump("msgs");
    toast("🎙️ Voice sent — everyone hears it");
  }catch(e){ writeFail(e); }
}

/* ---------- languages ---------- */
const LANGS={en:{n:"English",dir:"ltr",full:"English"},ckb:{n:"کوردی (سۆرانی)",dir:"rtl",full:"Central Kurdish (Sorani, Arabic script)"},kmr:{n:"Kurdî (Kurmancî)",dir:"ltr",full:"Northern Kurdish (Kurmanji, Latin script)"},ar:{n:"العربية",dir:"rtl",full:"Arabic"},tr:{n:"Türkçe",dir:"ltr",full:"Turkish"}};
const LI={ckb:1,kmr:2,ar:3,tr:4};
const DICT={}; for(const r of DICT_ROWS) DICT[r[0]]=r;
function detectLang(){
  try{ const s=localStorage.getItem("dk_lang"); if(s&&LANGS[s]) return s; }catch(e){}
  const n=(navigator.language||"en").toLowerCase();
  if(n.startsWith("ckb")||n==="ku"||n.startsWith("ku-iq")) return "ckb";
  if(n.startsWith("kmr")||n.startsWith("ku")) return "kmr";
  if(n.startsWith("ar")) return "ar"; if(n.startsWith("tr")) return "tr"; return "en";
}
S.lang=detectLang();
function t(k,v){ let s=k; if(S.lang!=="en"){ const r=DICT[k]; if(r&&r[LI[S.lang]]) s=r[LI[S.lang]]; } if(v) s=s.replace(/\{(\w+)\}/g,(_,x)=>v[x]??""); return s; }
const SKIP=".bub,.pbody,.dmt,.nt,.n,.nm,input,textarea,select,script,style,.logo-title,.combo .t b,.cap b,.pname,.rmeta b,.litem .t b,.u b,.lb b";
const CORE=/^([^\p{L}]*)([\s\S]*?)([^\p{L}.!?)]*)$/u;
function trText(n){
  if(n.__out!==undefined && n.nodeValue!==n.__out) n.__en=undefined;   // code changed it
  const en=n.__en!==undefined?n.__en:n.nodeValue;
  const m=en.match(CORE); if(!m||!m[2]) return;
  const r=DICT[m[2]];
  if(!r && n.__en===undefined) return;
  n.__en=en;
  const tr=r&&S.lang!=="en"?r[LI[S.lang]]:null;
  const out=tr?m[1]+tr+m[3]:en;
  n.__out=out; if(n.nodeValue!==out) n.nodeValue=out;
}
function trAttrs(el){
  for(const a of ["placeholder","title"]){
    if(!el.hasAttribute||!el.hasAttribute(a)) continue;
    const key="__"+a; if(el[key]===undefined) el[key]=el.getAttribute(a);
    const v=t(el[key]); if(el.getAttribute(a)!==v) el.setAttribute(a,v);
  }
}
function translateTree(root){
  if(!root) return;
  if(root.nodeType===3){ if(!(root.parentElement&&root.parentElement.closest(SKIP))) trText(root); return; }
  if(root.nodeType!==1) return;
  if(root.closest&&root.closest(SKIP)&&!root.matches("input,textarea")) return;
  trAttrs(root); root.querySelectorAll&&root.querySelectorAll("[placeholder],[title]").forEach(trAttrs);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest(SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n; while((n=w.nextNode())) trText(n);
}
let trBusy=false;
new MutationObserver(ms=>{
  if(trBusy) return; trBusy=true;
  try{ for(const m of ms){ if(m.type==="characterData") translateTree(m.target); else m.addedNodes.forEach(translateTree); } }
  finally{ trBusy=false; }
}).observe(document.getElementById("app"),{childList:true,subtree:true,characterData:true});
function applyDir(){ document.documentElement.lang=S.lang; document.documentElement.dir=LANGS[S.lang].dir; }
function setLang(l){
  if(!LANGS[l]) return; S.lang=l; try{localStorage.setItem("dk_lang",l)}catch(e){}
  applyDir(); translateTree($("#app"));
  if(S.me&&S.me.lang!==l) saveMe({lang:l}); else render();
}
applyDir();

function cname(k){
  if(k==="ku") return t("Kurdistan"); if(!k||k==="other") return t("Other");
  if(CN_KU[S.lang]&&CN_KU[S.lang][k]) return CN_KU[S.lang][k];
  try{ if(_dnLang!==S.lang){ _dn=new Intl.DisplayNames([S.lang==="ckb"?"ckb":S.lang,"en"],{type:"region"}); _dnLang=S.lang; } return _dn.of(k.toUpperCase())||k.toUpperCase(); }catch(e){ return k.toUpperCase(); }
}
function cflag(k){ if(k==="ku") return "☀️"; if(!k||k.length!==2) return "🌍"; return String.fromCodePoint(...k.toUpperCase().split("").map(c=>127397+c.charCodeAt(0))); }
function countryOptions(sel){
  const list=COUNTRY_CODES.map(k=>[k,cname(k)]); const head=list[0]; const rest=list.slice(1).sort((a,b)=>a[1].localeCompare(b[1]));
  return [head,...rest].map(([k,n])=>`<option value="${k}" ${k===sel?"selected":""}>${cflag(k)} ${esc(n)}</option>`).join("");
}
function detectCountry(){
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||"");
  if(S.lang==="ckb"||S.lang==="kmr") return "ku";
  const map={"Asia/Baghdad":"ku","Asia/Tehran":"ir","Europe/Istanbul":"tr","Asia/Damascus":"sy","Europe/Berlin":"de","Europe/London":"gb","Europe/Stockholm":"se","Europe/Amsterdam":"nl","Europe/Paris":"fr","Asia/Dubai":"ae","Asia/Riyadh":"sa"};
  if(map[tz]) return map[tz];
  const r=((navigator.language||"").split("-")[1]||"").toLowerCase(); return ISO.includes(r)?r:"ku";
}
function openCountryPicker(onPick){
  let q="";
  const draw=()=>{ const list=COUNTRY_CODES.filter(k=>!q||cname(k).toLowerCase().includes(q.toLowerCase())||k.includes(q.toLowerCase()));
    $("#cplist").innerHTML=list.map(k=>`<button class="lb" style="width:100%" onclick="cpPick('${k}')"><span style="font-size:22px">${cflag(k)}</span><b class="nt" style="flex:1;text-align:start">${esc(cname(k))}</b></button>`).join(""); };

  window.cpQ=v=>{q=v;draw()}; window.cpPick=k=>{ closeModal(); onPick(k); }; draw();
}

const BAD=["fuck","shit","bitch","bastard","asshole","whore","slut","dick","pussy","کس","شرموط","عاهرة","قحبة","زب","قەحپە","گو بخۆ","orospu","siktir","amk","piç","qehpe"];
S.filterBad=(()=>{ try{ return localStorage.getItem("dk_filter")!=="0"; }catch(e){ return true; } })();
function clean(s){ s=String(s??""); if(!S.filterBad) return s; for(const w of BAD){ const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"); s=s.replace(re,m=>"*".repeat(m.length)); } return s; }
const isBlocked=uid=>!!(S.me&&(S.me.blocked||[]).includes(uid));
const blocksMe=uid=>((prof(uid).blocked)||[]).includes(S.uid);
function toggleBlock(uid){
  const b=new Set(S.me.blocked||[]); const was=b.has(uid);
  was?b.delete(uid):b.add(uid);
  const f=new Set(S.me.following||[]); if(!was) f.delete(uid);
  saveMe({blocked:[...b],following:[...f]}); closeModal(); toast(was?t("Unblocked"):t("Blocked — you won't see their messages"));
}
const REPORT_REASONS=["Spam","Fake or offensive profile photo","Harassment or bullying","Hate speech","Nudity or sexual content","Violence or threats","Scam or fraud","Underage user","Other"];
function openReport(kind,target,label){
  let reason=0;
  const draw=()=>openModal(`<p style="margin:0 0 10px;opacity:.8">${esc(t("Why are you reporting this?"))} <b class="nt">${esc(label||"")}</b></p>
    ${REPORT_REASONS.map((r,i)=>`<button class="lb" style="width:100%" onclick="rpSel(${i})"><span style="font-size:18px">${i===reason?"🔘":"⚪"}</span><span style="flex:1;text-align:start">${r}</span></button>`).join("")}
    <label class="field" style="margin-top:10px"><span>Details (optional)</span><textarea id="rpn" maxlength="300"></textarea></label>
    <button class="gbtn" style="width:100%;padding:12px" onclick="rpSend()">Send report</button>`,{title:"🚩 Report",dark:!!S.cur});
  window.rpSel=i=>{ const n=$("#rpn").value; reason=i; draw(); $("#rpn").value=n; };
  window.rpSend=async()=>{
    if(!allow("report",5,864e5)) return;
    const item={kind,target,label:String(label||"").slice(0,80),reason:REPORT_REASONS[reason],note:$("#rpn").value.trim().slice(0,300),room:S.cur?S.cur.id:null,at:Date.now()};
    closeModal();
    try{ const ref=S.db.doc("reports/"+S.uid); const s=await ref.get(); const items=(s.exists&&s.data().items||[]).slice(-29); items.push(item); await ref.set({by:S.uid,items,at:Date.now()}); toast(t("Thanks — our team will review it")); }
    catch(e){ writeFail(e); }
  };
  draw();
}

async function adminSaveId(uid){
  const v=($("#nid").value||"").trim();
  if(!/^[A-Za-z0-9]{1,12}$/.test(v)) return toast(t("Only letters and numbers (max 12)"));
  const taken=Object.entries(S.profiles).some(([id,p])=>id!==uid&&String(p.sid||"")===v) || Object.entries(S.vipIds||{}).some(([id,s])=>id!==uid&&s===v);
  if(taken) return toast("⚠️ "+t("This ID is already taken"));
  try{ await S.db.doc("vipids/"+uid).set({sid:v,at:Date.now(),by:S.uid}); S.vipIds={...(S.vipIds||{}),[uid]:v}; toast("👑 "+t("ID changed")+" → "+v); adminChangeId(uid); render(); }catch(e){ writeFail(e); }
}

/* ---------- notifications ---------- */
S.notifs=[];
function notify(to,type,extra={}){ if(!to||to===S.uid||to==="room") return; S.db.collection("notifs").add({to,from:S.uid,type,at:Date.now(),...extra}).catch(()=>{}); }
function unreadNotifs(){ return S.notifs.filter(n=>n.at>(S.me.notifSeen||0)&&!isBlocked(n.from)).length + (S.announce&&S.announce.text&&S.announce.at>(S.me.annSeen||0)?1:0); }
function notifText(n){
  if(n.type==="follow") return t("started following you");
  if(n.type==="like") return t("liked your post");
  if(n.type==="comment") return t("commented on your post");
  if(n.type==="gift"){ const g=giftOf(n.gift); return t("sent you a gift")+` ${g.e}${n.qty>1?" x"+n.qty:""}`; }
  if(n.type==="admin") return t("made you a room admin");
  if(n.type==="invite") return t("invited you to")+" "+(n.rname||"");
  return "";
}
function openNotifs(){
  const list=S.notifs.filter(n=>!isBlocked(n.from)).slice(0,100);
  const ann=S.announce&&S.announce.text?`<div class="mission" style="border-color:var(--gold)"><div style="font-size:24px">📢</div><div class="t"><b>DANGI KURDISTAN</b><small class="nt">${esc(S.announce.text)}</small></div></div>`:"";
  openModal(ann+(list.map(n=>{ const p=prof(n.from), seen=n.at<=(S.me.notifSeen||0);
    return `<button class="lb" style="width:100%;${seen?"opacity:.7":""}" data-u="${esc(n.from)}" onclick="${n.type==="invite"?`closeModal();enterRoom('${String(n.room||"").replace(/\W/g,"")}')`:n.type==="follow"||n.type==="gift"?"openUser(this.dataset.u)":"closeModal();go('moments')"}">${avHTML(p,40)}<div style="flex:1;text-align:start"><b class="nt">${esc(p.nick)}</b> <span>${notifText(n)}</span><div style="font-size:11px;color:var(--muted)">${ago(n.at)}</div></div>${seen?"":'<span class="badge">●</span>'}</button>`; }).join("")||(ann?"":`<div class="empty"><div class="em">🔔</div>No notifications yet</div>`)),{title:"🔔 Notifications"});
  saveMe({notifSeen:Date.now(),annSeen:Date.now()});
}

/* ---------- global rankings ---------- */
async function openRankings(tab="wealth",period="week"){
  const tabs=[["wealth","💰 Wealth"],["charm","💝 Charm"],["rooms","🏰 Rooms"]], periods=[["day","Today"],["week","This week"],["all","All time"]];
  const head=`<div class="gcats" style="border-color:var(--line)">${tabs.map(([k,n])=>`<button class="${k===tab?"on":""}" style="color:${k===tab?"var(--ink)":"var(--muted)"}" onclick="openRankings('${k}','${period}')">${n}</button>`).join("")}</div>
    <div class="pick" style="margin-bottom:10px">${periods.map(([k,n])=>`<button class="${k===period?"on":""}" style="width:auto;height:auto;padding:6px 12px;font-size:12px" onclick="openRankings('${tab}','${k}')">${n}</button>`).join("")}</div>`;
  openModal(head+`<div class="empty">⏳</div>`,{title:"🏆 Rankings"});
  const since=period==="day"?Date.now()-864e5:period==="week"?Date.now()-7*864e5:0;
  let gifts=[]; try{ let q=S.db.collection("gifts"); if(since) q=q.where("at",">=",since); const s=await q.limit(1000).get(); gifts=s.docs.map(d=>d.data()); }catch(e){}
  const agg={};
  if(tab==="rooms"){
    if(period==="all") S.rooms.forEach(r=>agg[r.id]=r.score||0); else gifts.forEach(g=>{ if(g.room) agg[g.room]=(agg[g.room]||0)+(+g.c||0); });
  } else if(tab==="wealth"&&period==="all"){ Object.entries(S.profiles).forEach(([id,p])=>{ if(p.giftsSent) agg[id]=p.giftsSent; }); }
  else gifts.forEach(g=>{ const k=tab==="wealth"?g.from:g.to; if(k&&k!=="room") agg[k]=(agg[k]||0)+(+g.c||0); });
  const rows=Object.entries(agg).filter(([id])=>tab==="rooms"?S.rooms.some(r=>r.id===id):!isBlocked(id)).sort((a,b)=>b[1]-a[1]).slice(0,50);
  const item=id=>tab==="rooms"?(()=>{ const r=S.rooms.find(x=>x.id===id); return {name:r.name,av:`<div style="width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;background:${THEMES[r.theme||0]}">${roomAv(r)}</div>`,click:`closeModal();enterRoom('${id}')`}; })()
    :{name:prof(id).nick,av:avHTML(prof(id),44),click:`openUser('${id}')`,vip:vipBadge(prof(id))};
  const pod=rows.slice(0,3), medal=["🥇","🥈","🥉"], order=[1,0,2];
  const podium=pod.length?`<div style="display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:6px 0 14px">${order.filter(i=>pod[i]).map(i=>{ const [id,v]=pod[i], it=item(id);
      return `<button onclick="${it.click}" style="text-align:center;width:31%;padding:10px 4px;border-radius:16px;background:linear-gradient(180deg,${["#ffe08a","#e9ecef","#f4c39a"][i]},#fff);border:2px solid ${["#e0b100","#adb5bd","#d0894a"][i]};${i===0?"transform:translateY(-12px)":""}"><div style="font-size:24px">${medal[i]}</div><div style="display:flex;justify-content:center;margin:4px 0">${it.av}</div><b class="nt" style="font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</b><small style="color:var(--gold3);font-weight:700">${tab==="charm"?"💎":"🪙"} ${fmt(v)}</small></button>`; }).join("")}</div>`:"";
  openModal(head+podium+(rows.slice(3).map(([id,v],i)=>{ const it=item(id); return `<button class="lb" style="width:100%" onclick="${it.click}"><span class="rk2">${i+4}</span>${it.av}<b class="nt" style="flex:1;text-align:start">${esc(it.name)} ${it.vip||""}</b><span>${tab==="charm"?"💎":"🪙"} ${fmt(v)}</span></button>`; }).join("")||(rows.length?"":`<div class="empty"><div class="em">🏆</div>No one yet — send a gift to get on the board!</div>`)),{title:"🏆 Rankings"});
}

/* ---------- room moderation ---------- */
const ROOM_CATS=[["chat","💬","Chat"],["music","🎵","Music"],["games","🎮","Games"],["poetry","📜","Poetry"],["friends","🤝","Friends"],["learn","📚","Learning"],["news","📰","News"]];
const isRoomAdmin=(uid,r)=>{ r=r||(S.cur&&S.cur.data); return !!r&&(uid===r.ownerId||(r.admins||[]).includes(uid)); };
const isMutedIn=(r,uid)=>((r&&r.mutes||{})[uid]||0)>Date.now();
const isBannedIn=(r,uid)=>((r&&r.bans||{})[uid]||0)>Date.now();
async function modAction(kind,uid){
  const r=S.cur.data, ref=S.db.doc("rooms/"+S.cur.id), nick=prof(uid).nick; closeModal();
  try{
    if(kind==="mute"){ await ref.update({mutes:{[uid]:Date.now()+10*60e3}}); postRoom({type:"sys",text:"was muted for 10 minutes",target:uid}); }
    if(kind==="unmute"){ await ref.update({mutes:{[uid]:0}}); }
    if(kind==="kick"){ await ref.update({bans:{[uid]:Date.now()+60*60e3}}); postRoom({type:"sys",text:"was removed from the room",target:uid}); }
    if(kind==="admin"){ const a=new Set(r.admins||[]); a.add(uid); await ref.update({admins:[...a]}); notify(uid,"admin",{room:S.cur.id}); }
    if(kind==="unadmin"){ const a=new Set(r.admins||[]); a.delete(uid); await ref.update({admins:[...a]}); }
    toast(t("Done")+" ✓ "+nick);
  }catch(e){ writeFail(e); }
}
function openSeatMenu(i){
  const r=S.cur.data, locked=(r.lockedSeats||[]).includes(i);
  openModal(`<div class="fgrid" style="grid-template-columns:1fr 1fr">${locked?"":`<button class="ftile" onclick="closeModal();takeSeat(${i})"><span class="em">🎙️</span>Sit here</button>`}
    <button class="ftile" onclick="toggleSeatLock(${i})"><span class="em">${locked?"🔓":"🔒"}</span>${locked?"Unlock seat":"Lock seat"}</button></div>`,{title:"🎙️ "+t("Seat")+" "+(i+1),dark:true});
}

async function makePhoto(file){
  let bmp; try{ bmp=await createImageBitmap(file); }catch(e){ const url=URL.createObjectURL(file); bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }
  const W=bmp.width, H=bmp.height, side=Math.min(W,H), SZ=256;
  const c=document.createElement("canvas"); c.width=c.height=SZ; const x=c.getContext("2d");
  x.drawImage(bmp,(W-side)/2,(H-side)/2,side,side,0,0,SZ,SZ);
  let q=.85, url=c.toDataURL("image/jpeg",q); while(url.length>60000&&q>.4){ q-=.1; url=c.toDataURL("image/jpeg",q); }
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  return {url,blob};
}

/* ---------- anti-spam ---------- */
const RL={};
function allow(key,max,ms,silent){
  const now=Date.now(), a=(RL[key]=(RL[key]||[]).filter(x=>now-x<ms));
  if(a.length>=max){ if(!silent) toast(t("Slow down — you're sending too fast")); return false; }
  a.push(now); return true;
}
function spamOK(text,where,max=5,ms=10000){
  if(!allow(where,max,ms)) return false;
  const norm=String(text).trim().toLowerCase().replace(/\s+/g," ");
  const last=RL["last_"+where]||[];
  if(norm.length>1&&last.includes(norm)){ toast(t("You already sent that message")); return false; }
  RL["last_"+where]=[norm,...last].slice(0,3);
  if(/(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|io|me|ly|xyz)\b|t\.me\/|wa\.me\/)/i.test(text)&&(Date.now()-(S.me.at||0)<864e5||level(S.me.xp)<3)){ toast(t("New accounts can't send links yet")); return false; }
  if(/(.)\1{14,}/.test(text)){ toast(t("You already sent that message")); return false; }
  return true;
}

function fireDB(fs){
  const wrapDoc=r=>({id:r.id,path:r.path,
    get:()=>r.get(), set:d=>r.set(d), update:d=>r.set(d,{merge:true}), delete:()=>r.delete(),
    onSnapshot:(n,e)=>r.onSnapshot(n,e), collection:p=>wrapCol(r.collection(p)), acquire:async()=>({acquired:true})});
  const wrapCol=c=>({path:c.path, doc:id=>wrapDoc(id?c.doc(id):c.doc()), add:async d=>wrapDoc(await c.add(d)),
    where:(...a)=>c.where(...a), orderBy:(...a)=>c.orderBy(...a), limit:n=>c.limit(n), get:()=>c.get(), onSnapshot:(n,e)=>c.onSnapshot(n,e)});
  return {doc:p=>wrapDoc(fs.doc(p)), collection:p=>wrapCol(fs.collection(p))};
}

/* presence (who is online, who sits on which seat) stored in Firestore */
function fireRoom(fs,uid){
  const ref=fs.doc("presence/"+uid); const mine={uid,inRoom:null,seat:null}; let all=[];
  const lobbyCbs=new Set(), roomCbs=new Map();
  const push=()=>ref.set({...mine,at:Date.now()}).catch(()=>{});
  const peers=f=>{ const now=Date.now(); return all.filter(p=>p&&p.uid&&(p.uid===uid||now-(p.at||0)<150000)).map(p=>p.uid===uid?{...p,...mine}:p).filter(f)
    .map(p=>({by:p.uid,peer:p.uid,isMe:p.uid===uid,sameTab:p.uid===uid,kind:"viewer",guest:false,presence:p,updatedAt:p.at||0})); };
  const emit=()=>{ const lp=peers(()=>true); lobbyCbs.forEach(f=>f({peers:lp,joined:[],left:[],updated:[]}));
    roomCbs.forEach((set,id)=>{ const rp=peers(p=>p.inRoom===id); set.forEach(f=>f({peers:rp,joined:[],left:[],updated:[]})); }); };
  fs.collection("presence").limit(500).onSnapshot(s=>{ all=s.docs.map(d=>d.data()); if(!all.some(p=>p.uid===uid)) all.push({...mine,at:Date.now()}); emit(); },()=>{});
  setInterval(()=>{ push(); emit(); },60000);
  window.addEventListener("pagehide",()=>{ ref.set({uid,inRoom:null,seat:null,at:0}).catch(()=>{}); });
  push();
  const set=(patch)=>{ Object.assign(mine,patch); push(); emit(); return Promise.resolve(); };
  return {
    onPeers(f){ lobbyCbs.add(f); setTimeout(emit,0); return ()=>lobbyCbs.delete(f); },
    presence:set, connected:()=>true,
    async join(name){
      const id=name.replace(/^r-/,""); mine.inRoom=id; push(); const cbs=new Set(); roomCbs.set(id,cbs);
      return { name, presence:set, connected:()=>true,
        onPeers(f){ cbs.add(f); setTimeout(emit,0); return ()=>cbs.delete(f); },
        async leave(){ roomCbs.delete(id); mine.seat=null; if(mine.inRoom===id) mine.inRoom=null; push(); emit(); } };
    }
  };
}

/* ================================================================
   LIVE VOICE — tap 🎤 to turn your mic on, tap again to turn it off.
   Everyone in the room hears you live (WebRTC, peer to peer).
   Signaling goes through Firestore: rtc/{room}/sig
   ================================================================ */
const LV={on:false,stream:null,pcs:new Map(),room:null,unsub:null,audios:new Map(),meters:new Map(),levels:new Map(),speaking:new Set(),timer:null,needTap:false};
const LV_ICE={iceServers:[
  {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun2.l.google.com:19302"]},
  {urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}]};
const liveVoice=()=>!!(S.fb&&window.RTCPeerConnection&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);

/* signaling bus (replaceable for tests) */
const lvBus={
  listen(room,cb){ return S.fb.fs.collection(`rtc/${room}/sig`).where("to","==",S.uid).onSnapshot(s=>s.docChanges().forEach(ch=>{
      if(ch.type!=="added") return; const d=ch.doc.data(); ch.doc.ref.delete().catch(()=>{}); if(Date.now()-(d.at||0)<90000) cb(d); }),e=>console.warn("sig",e)); },
  send(room,to,type,sdp){ return S.fb.fs.collection(`rtc/${room}/sig`).add({from:S.uid,to,type,sdp:JSON.stringify(sdp),at:Date.now()}).catch(e=>console.warn("sig send",e)); }
};

function lvJoin(room){
  if(!liveVoice()) return; lvLeave(true);
  LV.room=room; LV.unsub=lvBus.listen(room,d=>lvSignal(d).catch(e=>console.warn("lv",e)));
  clearInterval(LV.timer); LV.timer=setInterval(lvTick,350);
}
function lvLeave(keepUi){
  if(LV.on) micOff(true);
  for(const id of [...LV.pcs.keys()]) lvDrop(id);
  if(LV.unsub){ try{LV.unsub()}catch(e){} LV.unsub=null; }
  clearInterval(LV.timer); LV.room=null; LV.speaking.clear(); LV.needTap=false;
}
function lvSync(peers){
  if(!LV.room) return;
  const ids=new Set((peers||[]).map(p=>p.by||(p.presence&&p.presence.uid)).filter(id=>id&&id!==S.uid));
  for(const id of ids) if(!LV.pcs.has(id)&&S.uid<id) lvCall(id).catch(e=>console.warn("lv call",e));
  for(const id of [...LV.pcs.keys()]) if(!ids.has(id)) lvDrop(id);
}
function lvNewPc(id){
  const pc=new RTCPeerConnection(LV_ICE);
  const o={pc,tr:null,id,at:Date.now()};
  pc.ontrack=e=>lvPlay(id,e.streams&&e.streams[0]||new MediaStream([e.track]));
  pc.onconnectionstatechange=()=>{ if(pc.connectionState==="failed"){ lvDrop(id); setTimeout(()=>{ if(S.cur&&LV.room) lvSync(S.cur.peers||[]); },2500); } };
  LV.pcs.set(id,o); return o;
}
function lvGathered(pc){ return new Promise(r=>{ if(pc.iceGatheringState==="complete") return r(); const t=setTimeout(r,2500); pc.addEventListener("icegatheringstatechange",()=>{ if(pc.iceGatheringState==="complete"){ clearTimeout(t); r(); } }); }); }
async function lvCall(id){
  const o=lvNewPc(id);
  o.tr=o.pc.addTransceiver("audio",{direction:"sendrecv"});
  if(LV.on&&LV.stream) await o.tr.sender.replaceTrack(LV.stream.getAudioTracks()[0]);
  await o.pc.setLocalDescription(await o.pc.createOffer());
  await lvGathered(o.pc);
  lvBus.send(LV.room,id,"offer",o.pc.localDescription.toJSON());
}
async function lvSignal(d){
  if(!LV.room||!d||!d.from||d.from===S.uid) return;
  const sdp=JSON.parse(d.sdp);
  if(d.type==="offer"){
    if(LV.pcs.has(d.from)) lvDrop(d.from);
    const o=lvNewPc(d.from);
    await o.pc.setRemoteDescription(sdp);
    o.tr=o.pc.getTransceivers()[0]; if(o.tr) o.tr.direction="sendrecv";
    if(o.tr&&LV.on&&LV.stream) await o.tr.sender.replaceTrack(LV.stream.getAudioTracks()[0]);
    await o.pc.setLocalDescription(await o.pc.createAnswer());
    await lvGathered(o.pc);
    lvBus.send(LV.room,d.from,"answer",o.pc.localDescription.toJSON());
  } else if(d.type==="answer"){
    const o=LV.pcs.get(d.from); if(o&&o.pc.signalingState==="have-local-offer") await o.pc.setRemoteDescription(sdp);
  }
}
function lvDrop(id){
  const o=LV.pcs.get(id); if(o){ try{o.pc.close()}catch(e){} LV.pcs.delete(id); }
  const a=LV.audios.get(id); if(a){ a.srcObject=null; a.remove(); LV.audios.delete(id); }
  const m=LV.meters.get(id); if(m){ try{m.src.disconnect()}catch(e){} LV.meters.delete(id); }
  LV.levels.delete(id);
}
function lvPlay(id,stream){
  let a=LV.audios.get(id);
  if(!a){ a=document.createElement("audio"); a.autoplay=true; a.setAttribute("playsinline",""); a.style.display="none"; document.body.appendChild(a); LV.audios.set(id,a); }
  if(a.srcObject!==stream) a.srcObject=stream;
  a.muted=!S.sound;
  const p=a.play(); if(p&&p.catch) p.catch(()=>{ LV.needTap=true; lvTapUi(); });
  lvMeter(id,stream);
}
function lvTapUi(){
  if(!LV.needTap||$("#lvtap")||!$("#roomView").classList.contains("show")) return;
  const b=document.createElement("button"); b.id="lvtap"; b.className="lvtap"; b.textContent="🔊 "+t("Tap to hear the voices");
  b.onclick=()=>{ LV.audios.forEach(a=>a.play().catch(()=>{})); ac(); LV.needTap=false; b.remove(); };
  $("#roomView").appendChild(b);
}
function lvMeter(id,stream){
  const c=ac(); if(!c||LV.meters.has(id)) return;
  try{ const src=c.createMediaStreamSource(stream), an=c.createAnalyser(), z=c.createGain(); an.fftSize=512; z.gain.value=0; src.connect(an); an.connect(z); z.connect(c.destination); LV.meters.set(id,{src,an,buf:new Float32Array(an.fftSize)}); }catch(e){ console.warn("meter",e); }
}
let lvTickBusy=false;
async function lvTick(){
  if(lvTickBusy) return; lvTickBusy=true;
  try{
    const now=Date.now(), TH=0.01;
    // remote + local levels from WebRTC stats (works on every browser, no audio graph needed)
    for(const [id,o] of LV.pcs){
      try{ const st=await o.pc.getStats(); st.forEach(x=>{
        if(x.type==="inbound-rtp"&&x.kind==="audio"&&(x.audioLevel||0)>TH) LV.levels.set(id,now);
        if(LV.on&&x.type==="media-source"&&x.kind==="audio"&&(x.audioLevel||0)>TH) LV.levels.set("me",now);
      }); }catch(e){}
    }
    // fallback analyser (used when you are alone in the room)
    LV.meters.forEach((m,id)=>{ m.an.getFloatTimeDomainData(m.buf); let s=0; for(const v of m.buf) s+=v*v; if(Math.sqrt(s/m.buf.length)>0.012) LV.levels.set(id,now); });
    const set=new Set(); LV.levels.forEach((ts,id)=>{ if(now-ts<700&&(id!=="me"||LV.on)) set.add(id==="me"?S.uid:id); });
    const changed=set.size!==LV.speaking.size||[...set].some(x=>!LV.speaking.has(x));
    if(changed){ LV.speaking=set; if(S.cur) renderSeats(); }
  } finally { lvTickBusy=false; }
}
async function micToggle(){ return LV.on?micOff():micOn(); }
async function micOn(){
  if(!S.cur) return;
  if(isMutedIn(S.cur.data,S.uid)) return toast(t("You are muted in this room"));
  if(!onSeat()) return toast("🪑 "+t("Sit on a seat first to talk"));
  try{ LV.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ return toast("🎤 "+t("Allow microphone access in your browser to talk")); }
  if(!onSeat()){ LV.stream.getTracks().forEach(t=>t.stop()); LV.stream=null; return; }
  LV.on=true;
  const tk=LV.stream.getAudioTracks()[0];
  LV.pcs.forEach(o=>{ if(o.tr) o.tr.sender.replaceTrack(tk).catch(()=>{}); });
  const m=LV.meters.get("me"); if(m){ try{m.src.disconnect()}catch(e){} LV.meters.delete("me"); }
  lvMeter("me",LV.stream);
  if(S.cur.named) S.cur.named.presence({mic:true}).catch(()=>{});
  micUi(); renderSeats(); toast("🎙️ "+t("Mic on — everyone in the room can hear you"));
}
function micOff(silent){
  LV.on=false;
  LV.pcs.forEach(o=>{ if(o.tr) o.tr.sender.replaceTrack(null).catch(()=>{}); });
  if(LV.stream){ LV.stream.getTracks().forEach(t=>t.stop()); LV.stream=null; }
  const m=LV.meters.get("me"); if(m){ try{m.src.disconnect()}catch(e){} LV.meters.delete("me"); }
  LV.levels.delete("me");
  if(S.cur&&S.cur.named) S.cur.named.presence({mic:false}).catch(()=>{});
  micUi(); if(S.cur) renderSeats(); if(!silent) toast("🔇 "+t("Mic off"));
}
function onSeat(){ if(!S.cur) return false; const me=roomPeople().find(p=>p.uid===S.uid); return !!(me&&me.seat!=null); }
function micUi(){ const b=$("#talkbtn"); if(b){ const tm=pkActive()?pkTeamOf(S.uid):null; b.classList.toggle("team-blue",tm==="blue"); b.classList.toggle("team-red",tm==="red"); } if(!b||!liveVoice()) return; b.style.opacity=(LV.on||onSeat())?"1":".55"; b.classList.toggle("live",LV.on); b.classList.toggle("off",!LV.on); b.textContent=LV.on?"🎙️":"🎤"; b.title=LV.on?t("Turn mic off"):t("Turn mic on"); }
function lvSoundSync(){ LV.audios.forEach(a=>a.muted=!S.sound); }
