<style>
:root{
  --bg:#f7f0e2; --card:#fffaf0; --gold:#c9a24a; --gold2:#e8c96f; --gold3:#8a6a1f; --ink:#3d2f17; --muted:#8b7a5a;
  --line:#ead9b4; --red:#e0393e; --green:#2aa65a; --dark:#0f0e12; --dark2:#1b1a20; --dark3:#2a2830;
  --shadow:0 4px 14px rgba(120,90,30,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9dfca}
body{font-family:"Poppins","Noto Sans Arabic",system-ui,sans-serif;color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
#app{max-width:480px;margin:0 auto;height:100%;position:relative;background:var(--bg);overflow:hidden;
  background-image:radial-gradient(circle at 10% 0%,#fff6dc 0,transparent 40%),radial-gradient(circle at 100% 30%,#f3e4bf 0,transparent 35%)}
.view{position:absolute;inset:0 0 64px 0;overflow-y:auto;overflow-x:hidden;padding-bottom:20px}
.latin{font-family:Cinzel,serif;letter-spacing:.5px}

/* splash */
#splash{position:absolute;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 40%,#fff3cf,#e8d29a 60%,#c9a24a);transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
.logo-title{font-family:Cinzel,serif;font-weight:900;font-size:28px;background:linear-gradient(180deg,#8a6a1f,#c9a24a 50%,#6b4f12);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;line-height:1.1}
.logo-sub{font-family:Cinzel,serif;font-size:13px;letter-spacing:6px;color:var(--gold3)}
.spin-sun{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fffaf0;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 10px;border-radius:22px;position:relative}
#nav button svg{width:22px;height:22px}
#nav button.on{background:linear-gradient(180deg,#f3dc9c,#e2c070);color:#4a3510;box-shadow:inset 0 0 0 1px #c9a24a}
.dot{position:absolute;top:2px;inset-inline-end:12px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* home */
.top{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold)}
.av.sm{box-shadow:0 0 0 2px var(--gold)}
.av span{line-height:1}
.welcome small{display:block;color:var(--muted);font-size:11px}
.welcome b{font-size:16px}
.iconbtn{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.coinbar{margin:4px 14px 12px;background:#fffaf0;border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,#d4a53c 60%,#9c7420);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#6b4c0f;font-weight:800;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.coin.s{width:18px;height:18px;font-size:9px}
.gbtn{background:linear-gradient(180deg,#f6dd96,#d9b25a);color:#4a3510;font-weight:700;border-radius:20px;padding:8px 16px;box-shadow:0 2px 0 #a8822e,inset 0 1px 0 #fff6d0}
.gbtn:active{transform:translateY(1px);box-shadow:0 1px 0 #a8822e}
.gbtn[disabled]{opacity:.5;filter:grayscale(.6)}
.gbtn.dark{background:linear-gradient(180deg,#3a3440,#24212a);color:#f3dc9c;box-shadow:0 2px 0 #000,inset 0 0 0 1px #6b5a2a}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}
.fcard{background:linear-gradient(180deg,#fdf4dc,#efdcae);border:2px solid #d8b665;border-radius:14px;padding:10px 4px;text-align:center;box-shadow:var(--shadow),inset 0 0 0 3px #fff6dd;position:relative}
.fcard .em{font-size:34px;height:52px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.fcard b{display:block;font-size:11.5px;margin:4px 0 6px;min-height:30px}
.arrow{width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#c9a24a,#8a6a1f);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.vip{margin:14px 12px;border-radius:18px;padding:16px;background:linear-gradient(135deg,#fbefcf,#f1d99a);border:2px solid #d4b061;box-shadow:var(--shadow),inset 0 0 0 4px #fff3d2}
.bar{height:8px;background:#e7d4a3;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c9a24a,#f1c94f);border-radius:6px}
.sect{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 6px}
.sect h3{margin:0;font-size:15px;color:var(--gold3)}
.sect a{color:var(--gold3);font-size:12px;cursor:pointer}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.gtile{flex:0 0 116px;height:132px;border-radius:16px;border:2px solid #d4b061;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-weight:800;text-shadow:0 2px 3px rgba(0,0,0,.4);box-shadow:var(--shadow);position:relative;overflow:hidden}
.gtile .em{font-size:44px}
.gtile small{font-size:11px;font-weight:600;opacity:.9}

/* tabs/chips */
.tabs{display:flex;gap:18px;padding:12px 16px 6px;align-items:center;position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 80%,transparent);z-index:3}
.tabs button{font-size:15px;color:var(--muted);padding:4px 0;position:relative}
.tabs button.on{color:var(--ink);font-weight:800}
.tabs button.on:after{content:"";position:absolute;bottom:-3px;left:20%;right:20%;height:3px;border-radius:2px;background:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 12px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12.5px;display:flex;gap:5px;align-items:center}
.chip.on{background:linear-gradient(180deg,#f3dc9c,#d9b25a);border-color:#c9a24a;font-weight:700}
.rankrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 12px 6px}
.rk{border-radius:14px;padding:10px 6px;text-align:center;color:#fff;border:2px solid #e9c46a;box-shadow:var(--shadow);font-size:12px;font-weight:700}
.rk .em{font-size:28px}

.rk.rkimg{background:none!important;border:0;box-shadow:none;padding:0 2px 4px;color:var(--gold3);display:flex;flex-direction:column;align-items:center;gap:2px}
.rkb{display:block;height:clamp(80px,25vw,104px);width:auto;max-width:100%;background-image:var(--rksprite);background-repeat:no-repeat;filter:drop-shadow(0 6px 10px rgba(90,50,0,.35));animation:rkFloat 3.2s ease-in-out infinite;transition:transform .15s}
.rk.rkimg:active .rkb{transform:scale(.94)}
.rkb.r1{aspect-ratio:186/170;background-size:277.4% 100%;background-position:0 0}
.rkb.r2{aspect-ratio:159/170;background-size:324.5% 100%;background-position:54.9% 0;animation-delay:.4s}
.rkb.r3{aspect-ratio:151/170;background-size:341.7% 100%;background-position:100% 0;animation-delay:.8s}
.rks{font-size:10.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#fff3c4,#f3d27e);border:1px solid #d9b25a;border-radius:10px;padding:1px 8px;color:#6b4c0f}
@keyframes rkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.rcard{border-radius:16px;overflow:hidden;background:#fff;border:2px solid #dcc07a;box-shadow:var(--shadow);text-align:start}
.rcover{height:150px;position:relative;display:flex;align-items:center;justify-content:center}
.rcover .em{font-size:62px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.rcover .cnt{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.45);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px}
.rcover .live{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;border-radius:8px;padding:0 6px;font-size:10px;font-weight:700}
.rmeta{padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:12px}
.rmeta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta small{color:var(--muted);font-size:10px;white-space:nowrap}
.fab{position:absolute;bottom:78px;inset-inline-end:16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#f3d27e,#c9a24a);color:#4a3510;font-size:30px;box-shadow:0 6px 16px rgba(120,80,10,.4);z-index:4;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .em{font-size:44px;opacity:.6}

/* moments */
.stories{display:flex;gap:12px;overflow-x:auto;padding:6px 12px 12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex-shrink:0;text-align:center;width:62px;font-size:11px}
.story .av{margin:0 auto 4px}
.post{background:#fffdf7;border-top:1px solid var(--line);padding:12px 14px}
.phead{display:flex;align-items:center;gap:10px}
.phead b{font-size:14px}
.phead small{display:block;color:var(--muted);font-size:11px}
.pbody{margin:10px 0;border-radius:14px;padding:22px 16px;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);white-space:pre-wrap;word-break:break-word;max-width:300px}
.pbody.plain{background:none!important;color:var(--ink);text-shadow:none;font-weight:500;font-size:15px;min-height:0;padding:0;display:block;text-align:start;max-width:none}
.pact{display:flex;gap:18px;align-items:center;color:var(--muted)}
.pact button{display:flex;gap:4px;align-items:center;font-size:13px}
.pact .liked{color:var(--red)}

/* messages */
.hero{height:170px;position:relative;background:linear-gradient(180deg,#f7c76a 0,#f4a75a 45%,#c57a3a 75%,#7b4a24);overflow:hidden}
.hero svg{position:absolute;bottom:0;left:0;width:100%}
.hero .tabs{background:none;position:absolute;top:0;left:0;right:0}
.hero .tabs button{color:#fff7e0}
.hero .tabs button.on{color:#fff}
.search{position:absolute;top:50px;left:12px;right:12px;background:#fffaf0;border-radius:14px;display:flex;align-items:center;padding:0 12px;gap:8px;box-shadow:var(--shadow)}
.search input{border:0;background:none;outline:0;padding:11px 0;flex:1}
.list{padding:8px 12px}
.litem{display:flex;align-items:center;gap:12px;background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:start}
.litem .t{flex:1;min-width:0}
.litem .t b{display:block;font-size:14px}
.litem .t small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.verified{color:#2f8cff;font-size:12px}

/* profile */
.pcover{height:150px;background:linear-gradient(180deg,#e9cf8c,#f7f0e2);position:relative}
.pcover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.6),transparent 30%),radial-gradient(circle at 80% 20%,rgba(255,255,255,.5),transparent 25%)}
.pcard{margin:-40px 0 0;background:var(--bg);border-radius:26px 26px 0 0;position:relative;padding:0 16px 16px;text-align:center}
.pcard .av{margin:-50px auto 10px}
.pname{font-size:20px;font-weight:800;color:var(--gold3)}
.lvl{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(90deg,#3b5bdb,#7048e8);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;margin:4px}

.vipid.mini{aspect-ratio:901/290;background-size:100% auto;background-position:0 90.7%;border-radius:10px;animation:vipGlowM 3s ease-in-out infinite}
.vipid .num{position:absolute;left:31.6%;width:62.2%;top:71.7%;height:16.7%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,"Times New Roman",Georgia,serif;font-weight:900;line-height:1;white-space:nowrap;letter-spacing:.02em;background:linear-gradient(180deg,#fff6d2 0%,#f7d46a 32%,#c88d1d 58%,#ffe28f 82%,#a66d17 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .35cqw 0 #4a2f06) drop-shadow(0 0 1.4cqw rgba(255,190,60,.55));animation:vipNum 3s ease-in-out infinite}
.vipid.mini .num{top:19%;height:63%}
.vipid::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,236,180,.45) 47%,rgba(255,255,255,.75) 50%,rgba(255,236,180,.45) 53%,transparent 62%);background-size:300% 100%;mix-blend-mode:screen;animation:vipSweep 3.4s ease-in-out infinite;pointer-events:none}
.vipid .sp{position:absolute;color:#fff3c0;font-style:normal;font-size:5cqw;text-shadow:0 0 1.5cqw #ffd36b,0 0 3cqw #ff9d2e;animation:vipTw 1.9s ease-in-out infinite;pointer-events:none}
.vipid .s1{left:48%;top:0}.vipid .s2{left:20%;top:8%;animation-delay:.6s}.vipid .s3{left:78%;top:7%;animation-delay:1.1s;font-size:3.6cqw}.vipid .s4{left:94%;top:69%;animation-delay:.3s;font-size:4cqw}.vipid .s5{left:3%;top:70%;animation-delay:1.4s}.vipid .s6{left:49%;top:63%;animation-delay:.9s;font-size:3.4cqw}
.vipid.mini .sp{display:none}.vipid.mini .s4,.vipid.mini .s5{display:block;top:6%;font-size:6cqw}
@keyframes vipGlow{0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.45),0 0 0 1px rgba(201,162,74,.35)}50%{box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 22px rgba(255,190,60,.55),0 0 0 1px rgba(255,214,120,.7)}}
@keyframes vipGlowM{0%,100%{box-shadow:0 0 0 1px rgba(201,162,74,.45)}50%{box-shadow:0 0 12px rgba(255,190,60,.6),0 0 0 1px rgba(255,214,120,.8)}}
@keyframes vipSweep{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
@keyframes vipTw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}
@keyframes vipNum{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
/* VIP profile background (black & gold) */
.sheet.vipsheet{background:radial-gradient(ellipse at 50% 0%,rgba(201,162,74,.28),transparent 60%),linear-gradient(180deg,#14110b,#0a0907 70%);color:#f3e2b0;border-top:1px solid rgba(201,162,74,.6);box-shadow:0 -10px 40px rgba(201,162,74,.18)}
.sheet.vipsheet .shead h3,.sheet.vipsheet .pname{color:#f7d46a}
.sheet.vipsheet .x{color:#f3e2b0}
.sheet.vipsheet .modrow button{background:rgba(255,255,255,.06)!important;color:#f3e2b0!important;border-color:rgba(201,162,74,.4)!important}
.sheet.vipsheet p{color:#d9c79a!important;opacity:1!important}
.sheet.vipsheet .gbtn.dark{box-shadow:0 2px 0 #000,inset 0 0 0 1px #c9a24a}
.sheet.vipsheet button[style*="opacity:.8"]{color:#f3e2b0!important}
.pcover.vipcover{background:linear-gradient(180deg,rgba(10,9,7,.15),rgba(10,9,7,.85)),var(--vipcard) center 22%/cover #0b0a08}
.pcover.vipcover:before{background:radial-gradient(circle at 50% 30%,rgba(255,200,80,.25),transparent 55%)}
.pcard.vipcard{background:linear-gradient(180deg,#14110b,#0d0b08);color:#f3e2b0;box-shadow:0 -6px 24px rgba(201,162,74,.25);border-top:1px solid rgba(201,162,74,.55)}
.pcard.vipcard .pname{color:#f7d46a}
.pcard.vipcard p,.pcard.vipcard small,.pcard.vipcard .stat small{color:#d9c79a!important}
.pcard.vipcard b{color:#fff1c4}
.idpill{display:inline-flex;gap:6px;align-items:center;background:linear-gradient(180deg,#5b4518,#2f230b);color:#f3d27e;border:1px solid #c9a24a;border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;direction:ltr}
.stats{display:flex;justify-content:space-around;margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.stats div{text-align:center}
.stats b{display:block;color:var(--gold3);font-size:17px}
.stats small{color:var(--muted)}
.menu{text-align:start}
.menu button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}
.menu .mi{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.menu .chev{margin-inline-start:auto;color:var(--muted)}

/* overlays */
.overlay{position:absolute;inset:0;z-index:20;display:none}
.overlay.show{display:block}
#roomView{background:var(--dark);color:#eee}
#roomView .bgfx{position:absolute;inset:0;pointer-events:none}

#roomView{background:linear-gradient(180deg,rgba(8,6,16,.25),rgba(8,6,16,.12) 30%,rgba(8,6,16,.45) 60%,rgba(8,6,16,.85)),var(--hawler) center top/cover no-repeat,#0b0a10}
#roomView .bgfx{opacity:.35}
.rcover{background-image:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.5)),var(--hawler)!important;background-size:cover!important;background-position:center 35%!important}
.rcover .em{filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.rhead{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px}
.rpill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:22px;padding:4px 12px 4px 6px;min-width:0}
.rpill .rav{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.rpill b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rpill small{font-size:10.5px;color:#aaa}
.lv1{background:#2aa65a;color:#fff;border-radius:6px;padding:0 5px;font-size:10px;margin-left:4px}
.dkbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#ddd}
.trophy{position:relative;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#3a2f12,rgba(58,47,18,.2));color:#f3c94f;font-weight:800;padding:4px 14px 4px 10px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);font-size:13px;margin:2px 0 0}
.onl{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border-radius:16px;padding:3px 10px;font-size:12px}
.seats{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:12px 4px;padding:14px 8px}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:#ccc;min-width:0}
.seat .s{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:26px;position:relative}
.seat .s.taken{border:2px solid #c9a24a}
.seat .s.me{border:2px solid #4cd97b;box-shadow:0 0 0 3px rgba(76,217,123,.25)}
.seat .s.talk{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(243,201,79,.55)}50%{box-shadow:0 0 0 7px rgba(243,201,79,0)}}
.seat .crown{position:absolute;top:-10px;font-size:15px}
.seat span.n{max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{width:20px;height:20px;opacity:.5}
.chatwrap{position:absolute;left:0;right:0;bottom:62px;top:330px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 10px}
.msgs{overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:6px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.notice{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;font-size:12.5px}
.notice b{color:#f3c94f}
.m{display:flex;gap:6px;align-items:flex-start;max-width:92%}
.m .bub{background:rgba(255,255,255,.1);border-radius:4px 14px 14px 14px;padding:6px 10px;font-size:13px;word-break:break-word;white-space:pre-wrap}
.m .nm{font-size:11px;color:#f3c94f;font-weight:700;margin-bottom:2px}
.sys{font-size:12px;color:#aaa;display:flex;gap:6px;align-items:center}
.gamemsg{background:linear-gradient(90deg,rgba(201,162,74,.25),rgba(201,162,74,.05));border:1px solid rgba(201,162,74,.4);border-radius:12px;padding:6px 10px;font-size:12.5px}
.giftmsg{background:linear-gradient(90deg,rgba(224,57,62,.35),rgba(224,57,62,.05));border:1px solid rgba(255,120,120,.4);border-radius:12px;padding:6px 10px;font-size:12.5px}
.rbar{position:absolute;left:0;right:0;bottom:0;height:62px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(transparent,rgba(0,0,0,.7) 40%)}
.rbar input{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:22px;padding:10px 14px;outline:0;min-width:0}
.rbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;color:#eee}
.rbtn.gold{background:radial-gradient(circle,#f3d27e,#a87f22);border-color:#f3d27e}
.giftfly{position:absolute;left:50%;top:40%;font-size:110px;transform:translate(-50%,-50%) scale(.2);opacity:0;z-index:30;pointer-events:none;animation:giftfly 2.4s ease-out forwards;filter:drop-shadow(0 0 30px rgba(255,210,90,.8))}
@keyframes giftfly{15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(.8)}}

/* sheets / modals */
#modal{position:absolute;inset:0;z-index:40;display:none;background:rgba(20,14,4,.55);align-items:flex-end}
#modal.show{display:flex}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px 22px;animation:up .25s ease-out}
.sheet.dk{background:#1c1b21;color:#eee}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:#cdb886;margin:4px auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shead h3{margin:0;font-size:17px;display:flex;gap:6px;align-items:center}
.x{width:32px;height:32px;border-radius:50%;background:rgba(128,128,128,.2);font-size:16px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:0;color:var(--ink)}
.field textarea{min-height:80px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{width:44px;height:44px;border-radius:12px;font-size:24px;border:2px solid transparent;background:#fff}
.pick button.on{border-color:var(--gold)}
.swatch{width:40px!important;height:40px!important;border-radius:50%!important}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ftile{background:#2a2830;border:1px solid #3a3842;border-radius:14px;padding:12px 4px;text-align:center;font-size:12px;color:#eee}
.ftile .em{font-size:30px;display:block;margin-bottom:4px}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gift{background:#2a2830;border:2px solid #3a3842;border-radius:14px;padding:8px 2px;text-align:center;font-size:11px;color:#eee}
.gift.on{border-color:#f3c94f;background:#3a3020}
.gift .em{font-size:32px;display:block}
.gift small{color:#f3c94f;display:flex;align-items:center;justify-content:center;gap:3px}
.ulist .u{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.tag{font-size:10px;border-radius:6px;padding:0 6px;font-weight:700}
.tag.own{background:#f3c94f;color:#3a2a00}
.tag.me{background:#4cd97b;color:#033}
#toast{position:absolute;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:#2b2215;color:#ffe6a6;padding:10px 18px;border-radius:20px;z-index:60;transition:transform .3s;font-size:13px;max-width:90%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
.banner{margin:8px 12px;padding:8px 12px;border-radius:12px;background:#fff3cd;border:1px solid #e8c96f;font-size:12px;color:#7a5a10}

/* dm */
#dmView{background:var(--bg)}
.dmhead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fffaf0}
.dmmsgs{position:absolute;top:60px;bottom:64px;left:0;right:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.dm{max-width:78%;padding:8px 12px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.dm.me{align-self:flex-end;background:linear-gradient(180deg,#f3dc9c,#e5c475);border-bottom-right-radius:4px}
.dm.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.dm time{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.dmbar{position:absolute;bottom:0;left:0;right:0;height:64px;display:flex;gap:8px;align-items:center;padding:0 12px;background:#fffaf0;border-top:1px solid var(--line)}
.dmbar input{flex:1;border:1px solid var(--line);border-radius:22px;padding:10px 14px;outline:0;background:#fff;min-width:0}

/* games */
.wheelbox{position:relative;width:270px;height:270px;margin:10px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid #c9a24a;box-shadow:0 0 0 4px #fff3d2,0 8px 24px rgba(0,0,0,.25);transition:transform 4.2s cubic-bezier(.17,.67,.12,.99);position:relative}
.wheel .lbl{position:absolute;left:50%;top:50%;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);font-size:15px;width:60px;margin-left:-30px;text-align:center}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #b3261e;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.hub{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#ffe9a3,#c9a24a);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.ttt{display:grid;grid-template-columns:repeat(3,84px);gap:8px;justify-content:center;margin:12px 0}
.ttt button{height:84px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:40px;font-weight:800}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.mem button{aspect-ratio:1;border-radius:12px;font-size:30px;background:linear-gradient(180deg,#d9b25a,#a8822e);color:transparent;transition:transform .2s}
.mem button.open,.mem button.done{background:#fff;color:inherit;border:2px solid var(--line)}
.mem button.done{opacity:.55}
.big{font-size:60px;text-align:center;margin:8px 0}
.center{text-align:center}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mission{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mission .t{flex:1}
.mission .t small{display:block;color:var(--muted)}
.lb{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.lb .rk2{width:26px;font-weight:800;color:var(--gold3);text-align:center}
.medal{display:inline-flex;flex-direction:column;align-items:center;width:30%;margin:1.5%;padding:10px 4px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:11.5px;text-align:center}
.medal .em{font-size:30px}
.medal.off{filter:grayscale(1);opacity:.45}

[dir=rtl] .chev,[dir=rtl] .arrow,[dir=rtl] .back{display:inline-block;transform:scaleX(-1)}
[dir=rtl] .rpill{padding:4px 6px 4px 12px}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.vchk{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:9px;font-weight:900;margin-inline-start:3px;vertical-align:middle;font-family:Poppins,sans-serif}
.vline{font-size:11.5px;color:#1d9bf0;margin:2px 0 4px}
.vipb{display:inline-block;color:#fff;font-size:9px;font-weight:800;border-radius:6px;padding:0 5px;vertical-align:middle;letter-spacing:.3px;font-family:Poppins,sans-serif}
.on-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 2px #fff;vertical-align:middle;margin-inline-start:4px}
.entry{position:absolute;top:22%;inset-inline-start:0;display:flex;align-items:center;gap:6px;color:#fff;padding:6px 40px 6px 10px;border-radius:0 30px 30px 0;font-size:13px;animation:entryIn 4.2s ease forwards;white-space:nowrap;z-index:2}
@keyframes entryIn{0%{transform:translateX(-110%)}12%{transform:translateX(0)}85%{transform:translateX(0);opacity:1}100%{transform:translateX(30%);opacity:0}}
.catrow{display:flex;gap:8px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}.catrow::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;border-radius:14px;padding:5px 12px;font-size:12px;background:#fff8e6;border:1px dashed #d8b665}
.cat.on{background:#3d2f17;color:#ffe9a3;border-style:solid}
.bub{cursor:pointer}
.annc{margin:6px 12px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,#3d2f17,#6b4f12);color:#ffe9a3;font-size:13px;display:flex;gap:8px;align-items:center}
.langrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 12px}
.langrow button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 10px;font-size:12px}
.langrow button.on{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
.modrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.modrow button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px;font-size:12.5px;color:inherit}
.sheet:not(.dk) .modrow button{background:#fff;border-color:var(--line)}
/* ===== gifts v2 ===== */
.gsheet{background:linear-gradient(180deg,#1d1a24,#121016);color:#eee}
.gto{display:flex;gap:10px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.gto::-webkit-scrollbar{display:none}
.gto button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#bbb;flex-shrink:0;width:56px}
.gto button .av{box-shadow:0 0 0 2px #444}
.gto button.on{color:#ffd76a}
.gto button.on .av{box-shadow:0 0 0 2px #ffd76a,0 0 12px #ffd76a}
.gcats{display:flex;gap:16px;border-bottom:1px solid #2e2b35;margin-bottom:10px}
.gcats button{padding:8px 0;color:#999;font-size:13.5px;position:relative}
.gcats button.on{color:#fff;font-weight:800}
.gcats button.on:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:3px;border-radius:2px;background:linear-gradient(90deg,#ff2d78,#ffd76a)}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:300px;overflow-y:auto;padding:2px}
.gi{border-radius:14px;padding:8px 2px 6px;text-align:center;font-size:11px;color:#ddd;border:2px solid transparent;position:relative;background:rgba(255,255,255,.03)}
.gi .em{font-size:34px;display:block;height:44px;line-height:44px;transition:transform .2s}
.gi.on{border-color:#ff2d78;background:rgba(255,45,120,.12)}

:root{--r:18px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --shadow:0 6px 18px rgba(110,80,20,.11),0 1px 3px rgba(110,80,20,.08);--ease:cubic-bezier(.2,.8,.2,1)}
html,body{height:100%;height:100dvh;overscroll-behavior:none}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%}
#app{width:100%;height:100%;height:100dvh}
.view{inset:0 0 calc(64px + var(--safe-b)) 0;padding-top:var(--safe-t);scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#nav{height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(255,250,240,.88);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-top:1px solid rgba(201,162,74,.28);box-shadow:0 -8px 24px rgba(110,80,20,.08)}

button,.gbtn,.chip,.cat,.rcard,.fcard,.gtile,.lb,.mission{transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .2s}
.rcard:active,.fcard:active,.gtile:active,.lb:active,.chip:active,.cat:active{transform:scale(.97)}
.gbtn{border-radius:14px;letter-spacing:.1px}
.coinbar,.vip,.fcard,.gtile,.mission{border-radius:var(--r)}
.coinbar,.mission{box-shadow:var(--shadow)}
.sheet{border-radius:26px 26px 0 0;padding-bottom:calc(22px + var(--safe-b));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet:before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:rgba(138,106,31,.25);margin:2px auto 8px}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(201,162,74,.35)!important;border-color:#c9a24a!important}
.fab{bottom:calc(78px + var(--safe-b));transition:transform .2s var(--ease)}

.chatwrap{bottom:calc(62px + var(--safe-b));transition:top .25s var(--ease)}

.l7win{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;text-align:center;z-index:5;padding:12px 26px;border-radius:20px;background:radial-gradient(circle,rgba(30,10,90,.92),rgba(30,10,90,.8));border:3px solid #ffd45a;box-shadow:0 0 30px rgba(255,212,90,.6)}
.l7win small{display:block;font-size:12px;color:#ffe9a8;font-weight:700}.l7win b{font-size:34px;font-weight:900;background:linear-gradient(180deg,#fff3a8,#ffb62e);-webkit-background-clip:text;background-clip:text;color:transparent}
.l7win b.lo{background:none;color:#ff9aa8;font-size:24px}.l7win.lose{border-color:#7a6aa8;box-shadow:none}
.l7win.show{animation:l7pop 2.6s ease both}.l7win.big{border-color:#ff5ce6;box-shadow:0 0 40px #ff5ce6}
@keyframes l7pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}12%{transform:translate(-50%,-50%) scale(1.1);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
.l7panel{display:none;position:absolute;left:8px;top:52px;width:min(250px,70%);max-height:70%;overflow:auto;background:rgba(22,6,70,.96);border:2px solid #ffd45a;border-radius:14px;padding:10px 12px;z-index:6;font-size:12px}
.l7panel.show{display:block;animation:crIn .2s}.l7panel .x{position:absolute;right:6px;top:4px;color:#fff;font-size:15px}
.l7panel h4{margin:0 0 6px;font-size:14px;color:#ffe08a}.l7panel .pr{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1)}.l7panel .pr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.l7panel .pr b{color:#ffd45a}
.l7panel p{margin:6px 0;line-height:1.45;color:#e7dcff}.l7panel .em{opacity:.7}.l7panel .hr{display:flex;align-items:center;gap:6px}.l7panel .hr svg{width:34px;height:30px}.l7panel .hr b{color:#ffd45a;margin-right:6px}
.l7intro{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#6a2ad0,#2a0b78 70%);transition:opacity .6s}.l7intro.out{opacity:0;pointer-events:none}
.l7logo{position:relative;text-align:center;animation:l7logo .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes l7logo{from{transform:scale(.3);opacity:0}}
.l7logo .pro{position:relative;left:26%;font-size:34px;font-weight:900;line-height:.8;background:linear-gradient(180deg,#fff3a8,#f0a31a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #7a4a05)}
.l7logo .lk{display:flex;align-items:center;gap:6px;padding:4px 20px;border:4px dotted #fff3b0;border-radius:36px;background:rgba(80,20,120,.5);box-shadow:0 0 22px #ffcf40}
.l7logo .lk span{font-size:50px;font-weight:900;font-style:italic;background:linear-gradient(180deg,#fff7b0,#ffb421);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #8a4e00)}
.l7logo .lk i{font-size:56px;font-weight:900;font-style:italic;background:linear-gradient(180deg,#ffb15a,#e8341c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6a1a00)}
.l7intro .f1,.l7intro .f2{position:absolute;width:64px;height:54px}.l7intro .f1{right:10%;top:30%;animation:l7fl 1.6s ease-in-out infinite alternate}.l7intro .f2{left:10%;top:34%;animation:l7fl 1.6s ease-in-out infinite alternate-reverse}
@keyframes l7fl{to{transform:translateY(-12px) rotate(8deg)}}
@media (max-height:700px){.l7box .frame{max-height:48px}.l7chip{width:38px;height:38px;font-size:11px}.l7box .mul{font-size:18px}}

.offan{position:relative;box-sizing:border-box;height:84px;margin:6px 6px;padding:23px 4px 15px 4px;border-style:solid;border-width:0 32px 0 110px;border-image:var(--annimg) 0 78 0 265 fill/0 32px 0 110px stretch;display:flex;align-items:center;color:#2a1a05;direction:ltr;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.offan .ot{flex:1;min-width:0;text-align:center;direction:ltr}
.offan .ot b{display:block;font-size:14px;font-weight:800;line-height:1.15;color:#1c1204;unicode-bidi:plaintext}
.offan .ot span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;line-height:1.25;font-weight:600;color:#4a3410;unicode-bidi:plaintext}
.offan .ox{position:absolute;right:-31px;top:30px;width:30px;height:30px;border-radius:50%;background:transparent}
.swp,.rmn{position:absolute;z-index:30;border-radius:28px;background:rgba(48,44,68,.62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:crIn .18s}
.swp button,.rmn button{display:flex;align-items:center;gap:12px;color:#fff;font-size:16px;font-weight:500;padding:14px 22px;white-space:nowrap}
.rmn{top:52px;right:10px;min-width:210px;border-radius:24px;padding:6px 0}.rmn button{width:100%;padding:13px 20px}
.rbub{position:absolute;right:10px;bottom:86px;z-index:26;display:flex;align-items:center;gap:8px;max-width:230px;padding:6px 8px 6px 6px;border-radius:30px;background:linear-gradient(135deg,#3b2a8c,#1c1050);border:2px solid #ffd45a;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.45);animation:crIn .25s;cursor:pointer}
.rbub .rav{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.rbub .rbt{min-width:0;display:flex;flex-direction:column;line-height:1.15}.rbub .rbt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rbub .rbt small{font-size:11px;color:#cfc2ff;display:flex;align-items:center;gap:4px}
.rbub .rbx{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:12px;flex:none}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px}.eq i{width:3px;background:#4cd97b;border-radius:2px;animation:eqb .8s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eqb{0%,100%{height:3px}50%{height:10px}}
.invrow{display:flex;align-items:center;gap:10px;width:100%}.invb{padding:6px 14px;font-size:13px}.invb.done{background:#2f7d4a;opacity:.85}
.invpop{position:absolute;left:8px;right:8px;top:10px;z-index:58;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:linear-gradient(135deg,#3b2a8c,#1c1050);border:2px solid #ffd45a;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.5);animation:crIn .3s}
.invpop .it{flex:1;min-width:0;display:flex;flex-direction:column}.invpop .it b{font-size:14px}.invpop .it small{font-size:12px;color:#d8ccff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invpop .ix{color:#fff;opacity:.7;font-size:15px}
/* ===== room picture ===== */
.rav{overflow:hidden}.rav .ri{font-weight:800;color:#fff;font-size:17px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rcover .rph{width:104px;height:104px;border-radius:24px;overflow:hidden;border:3px solid rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(0,0,0,.55);background:#222}
.rcover .rph img{width:100%;height:100%;object-fit:cover;display:block}
.rcover .rph.sm{width:84px;height:84px;border-radius:20px}
.rpicbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.rcard.hasph .rcover{background-image:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.45))!important}
.rcard.vipc{position:relative;border:0!important;padding:3px;background:linear-gradient(90deg,#ffd45a,#ff3d9a,#52e5ff,#7dff6a,#ffd45a,#ff3d9a);background-size:300% 100%;animation:vipled 2.5s linear infinite;box-shadow:0 0 12px rgba(255,205,90,.85),0 0 26px rgba(255,61,154,.45)}
.rcard.vipc .rcover{border-radius:13px 13px 0 0}.rcard.vipc .rmeta{background:#fff8e6;border-radius:0 0 13px 13px}
.rcard.vipc .vtag{position:absolute;top:8px;left:8px;background:linear-gradient(135deg,#ffe08a,#f0a81c);color:#4a2d00;border-radius:8px;padding:1px 7px;font-size:10px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:2}
@keyframes vipled{to{background-position:300% 0}}
/* ===== VIP luxury entrance banner ===== */
.vbn{position:absolute;top:47%;left:50%;width:min(94%,380px);transform:translateX(-50%);z-index:3;pointer-events:none;animation:vbnIn 5s cubic-bezier(.2,.9,.25,1) forwards}
.vbn .vb{position:relative;display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:40px;overflow:hidden;color:#fff;background:linear-gradient(100deg,rgba(18,12,4,.94),rgba(52,34,8,.94) 55%,rgba(18,12,4,.94));border:2px solid var(--vc);box-shadow:0 0 0 1px rgba(255,236,170,.55) inset,0 0 18px var(--vc),0 10px 26px rgba(0,0,0,.55)}
.vbn .vb:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,240,190,.55) 50%,transparent 65%);transform:translateX(-120%);animation:vbnShine 1.6s .6s ease-in-out 2}
.vbn .vav{position:relative;flex:none;border-radius:50%;padding:2px;background:linear-gradient(135deg,#fff2b0,var(--vc),#fff2b0);box-shadow:0 0 10px var(--vc)}
.vbn .vcr{position:absolute;top:-4px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:15px;z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.vbn .vtx{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.vbn .vtx small{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#ffe9a3;font-weight:700}
.vbn .vtx b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(180deg,#fffbe6,#ffd45a 60%,#e8a317);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.vbn .vtx span{font-size:11px;color:#f4e6c0;opacity:.92}
.vbn .vlv{margin-inline-start:auto;flex:none;background:linear-gradient(135deg,#ffe08a,var(--vc));color:#2b1800;font-weight:900;font-size:11px;padding:3px 9px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
@keyframes vbnIn{0%{transform:translateX(-50%) translateX(120%);opacity:0}10%{transform:translateX(-50%) translateX(0);opacity:1}86%{transform:translateX(-50%) translateX(0);opacity:1}100%{transform:translateX(-50%) translateX(-120%);opacity:0}}
@keyframes vbnShine{to{transform:translateX(120%)}}
/* tidy, uniform home feature tiles */
.feat{grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 10px 4px;align-items:center;justify-items:center}
.fcard.fimg{width:100%;height:clamp(140px,42vw,170px);display:flex;align-items:center;justify-content:center}
.fb{width:auto!important;max-width:100%!important;height:100%;animation:none!important;filter:drop-shadow(0 5px 8px rgba(80,40,0,.32))}

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const today = () => new Date().toISOString().slice(0,10);
const fmt = n => { n = +n||0; if (n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M"; if (n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"")+"K"; return String(n); };
function ago(ts){ if(!ts) return ""; const s=(Date.now()-ts)/1000; if(s<60) return t("just now"); if(s<3600) return t("{n}m ago",{n:Math.floor(s/60)}); if(s<86400) return t("{n}h ago",{n:Math.floor(s/3600)}); return t("{n}d ago",{n:Math.floor(s/86400)}); }

/* ============ in-memory store (preview/fallback) ============ */
function MemDB(){
  const store=new Map(), subs=new Set();
  const notify=()=>{ for(const f of [...subs]) try{f()}catch(e){console.error(e)} };
  const parent=p=>p.split("/").slice(0,-1).join("/");
  const clone=o=>JSON.parse(JSON.stringify(o));
  const snap=p=>{ const d=store.get(p); return {id:p.split("/").pop(),exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}}; };
  const merge=(a,b)=>{ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) merge(a[k],b[k]); else a[k]=b[k]; } return a; };
  function docRef(p){ return {id:p.split("/").pop(),path:p,
    get:async()=>snap(p),
    set:async d=>{store.set(p,clone(d));notify()},
    update:async d=>{const c=store.get(p); if(!c) throw {code:"invalid_argument"}; store.set(p,merge(clone(c),clone(d))); notify()},
    delete:async()=>{store.delete(p);notify()},
    onSnapshot(n){const f=()=>n(snap(p)); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f)},
    collection:c=>colRef(p+"/"+c)}; }
  function query(p,fl,ord,lim){
    const run=()=>{ let docs=[...store.keys()].filter(k=>parent(k)===p).sort().map(snap);
      docs=docs.filter(s=>fl.every(([f,op,v])=>{const x=s.data()[f]; switch(op){case"==":return x===v;case"!=":return x!==v;case">":return x>v;case"<":return x<v;case">=":return x>=v;case"<=":return x<=v;case"in":return v.includes(x);case"array-contains":return Array.isArray(x)&&x.includes(v);} return true;}));
      if(ord){const[f,dir]=ord; docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f]; if(x===y)return 0; if(x===undefined)return 1; if(y===undefined)return -1; return (x<y?-1:1)*(dir==="desc"?-1:1);});}
      if(lim) docs=docs.slice(0,lim);
      return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}; };
    return { where:(f,o,v)=>query(p,[...fl,[f,o,v]],ord,lim), orderBy:(f,d="asc")=>query(p,fl,[f,d],lim), limit:n=>query(p,fl,ord,n),
      get:async()=>run(), onSnapshot(n){const f=()=>n(run()); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f)} };
  }
  function colRef(p){ return Object.assign(query(p,[],null,null),{path:p,doc:id=>docRef(p+"/"+(id||rid())),add:async d=>{const r=docRef(p+"/"+rid()); await r.set(d); return r;}}); }
  return {doc:docRef,collection:colRef};
}

async function boot(){
  if (useFirebase()) return bootFirebase();
  let db=null,user=null,room=null;
  if (window.claude && claude.use) {
    [db,user,room,S.sample] = await Promise.all([claude.use("db"),claude.use("user"),claude.use("room"),claude.use("sample")].map(p=>p.catch(()=>null)));
  }
  S.user=user; S.room=room;
  if (window.claude && claude.use && (!db || !user)) return showSignIn();
  if (db) {
    S.db=db; S.local=false;
    S.uid = await user.id().catch(()=>null);
    if (!S.uid) return showSignIn();
    try{ const me=await user.me(); S.myName=me.name||""; S.myAvatar=me.avatarUrl||""; }catch(e){}
    try { if (user) { const c=await user.can("data.write"); if (c===false) S.canWrite=false; } } catch(e){}
  } else {
    S.db=MemDB(); S.local=true; S.uid="me"; seedLocal();
  }
  subscribeAll();
  // profile
  const timer=setTimeout(()=>{ if(!S.me) startOnboarding(); },10000);
  const snap = await S.db.doc("profiles/"+S.uid).get().catch(()=>null);
  clearTimeout(timer);
  try{ const b=await S.db.doc("bans/"+S.uid).get(); if(b.exists&&(b.data().until||0)>Date.now()) return showSuspended(b.data().until); }catch(e){}
  if (snap && snap.exists) { S.me=snap.data(); S.me._id=S.uid; render(); hideSplash(); routeHash(); }
  else startOnboarding();
  if (S.room) lobbyPresence();
}
/* admin coins arrive as "grants"; the receiver adds them to their own wallet once */
const GR_SEEN=new Set();
async function claimGrant(d){
  if(!S.me||GR_SEEN.has(d.id)) return; GR_SEEN.add(d.id);
  const g=d.data()||{}, n=Math.trunc(+g.amount||0); if(!n||g.to!==S.uid) return;
  try{ await S.db.doc("grants/"+d.id).delete(); }catch(e){ GR_SEEN.delete(d.id); return; }
  saveMe({coins:Math.max(0,(S.me.coins||0)+n)});
  toast(n>0?`🎁 +${fmt(n)} 🪙 ${t("from DANGI admin")}`:`🪙 ${fmt(n)}`); if(n>0) playSnd&&playSnd("chime");
}
/* 50% of every gift you receive comes back to you as coins */
const GIFT_SHARE=0.5;
function earnGifts(list){
  if(!S.me) return;
  const since=S.me.earnAt||S.me.at||0; let sum=0, mx=since;
  for(const g of list){ const at=+g.at||0; if(at>since&&g.from!==S.uid&&g.to===S.uid){ sum+=+g.c||0; if(at>mx) mx=at; } }
  if(mx<=since) return;
  const n=Math.floor(sum*GIFT_SHARE);
  saveMe({coins:(S.me.coins||0)+n,earnAt:mx,giftsGot:(S.me.giftsGot||0)+n});
  if(n) toast(`💝 +${fmt(n)} 🪙 ${t("from gifts you received (50%)")}`);
}
/* ================= PK BATTLE: Blue team vs Red team ================= */
const PK_MAX=15, PK_DUR=10*60e3;
const pkOf=()=>(S.cur&&S.cur.data&&S.cur.data.pk)||null;
const pkActive=()=>{ const p=pkOf(); return !!(p&&p.state&&p.state!=="off"); };
function pkTeamOf(uid,pk){ pk=pk||pkOf(); if(!pk||!pk.state||pk.state==="off") return null; return (pk.blue||[]).includes(uid)?"blue":(pk.red||[]).includes(uid)?"red":null; }
const pkLeft=pk=>Math.max(0,(pk.end||0)-Date.now());
const mmss=ms=>{ const s=Math.ceil(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
async function pkWrite(pk){
  if(!S.cur) return; const id=S.cur.id;
  try{
    if(S.fb) await S.fb.fs.doc("rooms/"+id).update({pk});
    else { const s=await S.db.doc("rooms/"+id).get(); const d=s.data()||{}; d.pk=pk; await S.db.doc("rooms/"+id).set(d); }
    if(S.cur&&S.cur.id===id){ S.cur.data={...S.cur.data,pk}; renderPK(); renderSeats(); micUi(); }
  }catch(e){ writeFail(e); }
}
function pkAddScore(to,cost){
  const pk=pkOf(); if(!pk||pk.state!=="live"||pkLeft(pk)<=0) return;
  const tm=pkTeamOf(to,pk); if(!tm) return; const k=tm==="blue"?"sb":"sr", id=S.cur.id;
  if(S.fb){ const FV=firebase.firestore.FieldValue; S.fb.fs.doc("rooms/"+id).update({["pk."+k]:FV.increment(cost),["pk.pts."+to]:FV.increment(cost)}).catch(()=>{}); }
  else pkWrite({...pk,[k]:(pk[k]||0)+cost,pts:{...(pk.pts||{}),[to]:((pk.pts||{})[to]||0)+cost}});
}
async function pkJoin(team){
  const pk=pkOf(); if(!pk||!pk.state||pk.state==="off") return;
  if(pk.state==="done") return toast(t("This battle is over"));
  const other=team==="blue"?"red":"blue", cur=pkTeamOf(S.uid,pk);
  if(cur===team) return;
  if(cur&&pk.state==="live") return toast(t("You can't switch teams during the battle"));
  if((pk[team]||[]).length>=PK_MAX) return toast(t("This team is full"));
  if(S.fb){ const FV=firebase.firestore.FieldValue; try{ await S.fb.fs.doc("rooms/"+S.cur.id).update({["pk."+team]:FV.arrayUnion(S.uid),["pk."+other]:FV.arrayRemove(S.uid)}); }catch(e){ return writeFail(e); } }
  else await pkWrite({...pk,[team]:[...(pk[team]||[]),S.uid],[other]:(pk[other]||[]).filter(x=>x!==S.uid)});
  playSnd&&playSnd("chime"); toast(team==="blue"?"🔵 "+t("You joined the Blue team"):"🔴 "+t("You joined the Red team"));
}
function pkNew(){ return {state:"setup",blue:[],red:[],sb:0,sr:0,pts:{},by:S.uid,at:Date.now()}; }
async function pkOpenSetup(){ if(!isRoomAdmin(S.uid)) return; closeModal(); await pkWrite(pkNew()); postRoom({type:"sys",text:"opened a PK battle ⚔️ — pick a team!"}); }
async function pkAutoSplit(){
  const pk=pkOf()||pkNew(); const seated=roomPeople().filter(p=>p.seat!=null).sort((a,b)=>a.seat-b.seat).map(p=>p.uid);
  const blue=[...(pk.blue||[])], red=[...(pk.red||[])];
  seated.forEach(u=>{ if(blue.includes(u)||red.includes(u)) return; (blue.length<=red.length&&blue.length<PK_MAX?blue:red.length<PK_MAX?red:blue).push(u); });
  await pkWrite({...pk,blue:blue.slice(0,PK_MAX),red:red.slice(0,PK_MAX)});
}
async function pkStart(){
  const pk=pkOf(); if(!pk||!isRoomAdmin(S.uid)) return;
  if(!(pk.blue||[]).length||!(pk.red||[]).length) return toast(t("Each team needs at least 1 player"));
  const now=Date.now(); await pkWrite({...pk,state:"live",start:now,end:now+PK_DUR,sb:0,sr:0,pts:{},winner:null});
  postRoom({type:"sys",text:"started the PK battle ⚔️ 10 minutes!"});
}
async function pkRematch(){ const pk=pkOf(); if(!pk) return; await pkWrite({...pkNew(),blue:pk.blue||[],red:pk.red||[]}); }
async function pkClose(){ if(!isRoomAdmin(S.uid)) return; closeModal(); await pkWrite({state:"off"}); }
function pkWinner(pk){ const b=pk.sb||0, r=pk.sr||0; return b>r?"blue":r>b?"red":"draw"; }
function pkTick(){
  const pk=pkOf(); if(!pk||!S.cur) return;
  if(pk.state==="live"){
    if(pkLeft(pk)<=0){ const w=pkWinner(pk); pkWrite({...pk,state:"done",winner:w}); pkShowWinner({...pk,winner:w}); }
    else { const el=$("#pktm"); if(el) el.textContent=mmss(pkLeft(pk)); if(el) el.classList.toggle("hot",pkLeft(pk)<60e3); }
  }
  if(pk.state==="done"&&S.pkShown!==pk.start) pkShowWinner(pk);
}

function pkAvs(pk,team,n=3){ return pkMvp(pk,team).slice(0,n).map(([u])=>`<span class="pkav">${avHTML(prof(u),26)}</span>`).join(""); }

function annHide(k){ if(k==="g"){ S.annHide=(S.announce&&S.announce.at)||1; render(); } else if(S.cur){ S.cur.noticeHide=true; renderMsgs(); } }
function seatTap(i,ev){
  if(!S.cur) return; const mine=roomPeople().find(p=>p.uid===S.uid);
  if(i===0&&S.cur.data.ownerId!==S.uid) return toast("This seat is reserved for the room owner 👑");
  if(mine&&mine.seat!=null&&mine.seat!==i&&ev&&ev.currentTarget){ seatSwitchPop(i,ev.currentTarget); } else takeSeat(i);
}
function closeSwp(){ const d=$("#swp"); if(d) d.remove(); }
function seatSwitchPop(i,btn){
  closeSwp(); const rv=$("#roomView"), b=btn.getBoundingClientRect(), r=rv.getBoundingClientRect();
  const d=document.createElement("div"); d.id="swp"; d.className="swp";
  d.innerHTML=`<button onclick="event.stopPropagation();closeSwp();takeSeat(${i})"><svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg><span>${esc(t("Switch"))}</span></button>`;
  rv.appendChild(d);
  const w=d.offsetWidth; let x=b.left-r.left+b.width/2-w/2; x=Math.max(8,Math.min(r.width-w-8,x));
  d.style.left=x+"px"; d.style.top=(b.top-r.top+b.height*.15)+"px";
  setTimeout(()=>{ const off=e=>{ if(!e.target.closest||!e.target.closest("#swp")) closeSwp(); rv.removeEventListener("click",off,true); }; rv.addEventListener("click",off,true); },0);
}
function roomMenu(ev){
  const old=$("#rmn"); if(old){ old.remove(); return; }
  const rv=$("#roomView"), d=document.createElement("div"); d.id="rmn"; d.className="rmn";
  d.innerHTML=`<button onclick="roomMin()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M14 10l7-7M21 8V3h-5M10 14l-7 7M3 16v5h5"/><path d="M10 14l-3 0M14 10l3 0" opacity="0"/></svg><span>${esc(t("Minimize"))}</span></button>
    <button onclick="document.getElementById('rmn').remove();leaveRoom()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3v9M6.3 6.5a8 8 0 1 0 11.4 0"/></svg><span>${esc(t("Exit"))}</span></button>`;
  rv.appendChild(d);
  setTimeout(()=>{ const off=e=>{ const m=$("#rmn"); if(m&&!m.contains(e.target)) m.remove(); rv.removeEventListener("click",off,true); }; rv.addEventListener("click",off,true); },0);
}
function roomMin(){
  if(!S.cur) return; const m=$("#rmn"); if(m) m.remove(); closeSwp();
  S.cur.min=true; $("#roomView").classList.remove("show"); setHash(""); roomBubble(); render();
}
function roomBubble(){
  let b=$("#rbub"); if(!S.cur||!S.cur.min){ if(b) b.remove(); return; }
  const r=S.cur.data; if(!b){ b=document.createElement("div"); b.id="rbub"; b.className="rbub"; b.onclick=roomRestore; $("#app").appendChild(b); }
  b.innerHTML=`<div class="rav" style="background:${THEMES[r.theme||0]}">${roomAv(r)}</div><div class="rbt"><b>${esc(r.name)}</b><small><span class="eq"><i></i><i></i><i></i></span> ${roomPeople().length} 👤</small></div><button class="rbx" aria-label="Exit" onclick="event.stopPropagation();leaveRoom()">✕</button>`;
}
function roomRestore(){
  if(!S.cur) return; S.cur.min=false; const b=$("#rbub"); if(b) b.remove();
  $("#roomView").classList.add("show"); try{ setHash("room-"+S.cur.id); }catch(e){} renderSeats(); renderMsgs();
}
/* ---- invite people to the room ---- */
function openInvite(){
  if(!S.cur) return;
  const inRoom=new Set(roomPeople().map(p=>p.uid)), sent=(S.cur.invited=S.cur.invited||new Set());
  const online=new Set((S.lobbyPeers||[]).map(p=>p.by||(p.presence&&p.presence.uid)).filter(Boolean));
  const fol=new Set(S.me.following||[]), ok=u=>u&&u!==S.uid&&!inRoom.has(u)&&!isBlocked(u)&&S.profiles[u];
  const A=[...new Set([...fol,...online,...Object.keys(S.profiles)])].filter(ok).sort((a,b)=>(online.has(b)?2:0)+(fol.has(b)?1:0)-(online.has(a)?2:0)-(fol.has(a)?1:0)).slice(0,60);
  const row=u=>{ const p=prof(u); return `<div class="u invrow">${avHTML(p,40)}<div style="flex:1;min-width:0"><b class="nt">${esc(p.nick)}</b> ${onlineDot(u)}<div style="font-size:11px;color:#9aa">${fol.has(u)?esc(t("Following")):""}</div></div><button class="gbtn invb ${sent.has(u)?"done":""}" data-u="${esc(u)}" onclick="inviteSend(this)">${sent.has(u)?"✓ "+esc(t("Sent")):esc(t("Invite"))}</button></div>`; };
  openModal(`<button class="gbtn dark" style="width:100%;margin-bottom:10px" onclick="shareRoom()">🔗 ${esc(t("Copy link"))}</button>
    <div class="ulist">${A.map(row).join("")||`<div class="empty"><div class="em">👥</div>${esc(t("No one to invite"))}</div>`}</div>`,{title:"📨 "+t("Invite to this room"),dark:true});
}
function inviteSend(btn){
  if(!S.cur) return; const u=btn.dataset.u; const sent=(S.cur.invited=S.cur.invited||new Set()); if(sent.has(u)) return;
  sent.add(u); const r=S.cur.data; notify(u,"invite",{room:S.cur.id,rname:r.name||"",ricon:""});
  btn.textContent="✓ "+t("Sent"); btn.classList.add("done"); try{ playSnd&&playSnd("pop"); }catch(e){}
}
function inviteWatch(){
  if(!S.me||!S.notifs) return; S.invShown=S.invShown||new Set(); const now=Date.now();
  for(const n of S.notifs){
    if(n.type!=="invite"||isBlocked(n.from)||now-n.at>90000||S.invShown.has(n.id)) continue;
    S.invShown.add(n.id); if(S.cur&&S.cur.id===n.room&&!S.cur.min) continue; showInvite(n); break;
  }
}
function showInvite(n){
  const old=$("#invpop"); if(old) old.remove(); const p=prof(n.from), room=String(n.room||"").replace(/\W/g,"");
  const d=document.createElement("div"); d.id="invpop"; d.className="invpop";
  d.innerHTML=`${avHTML(p,40)}<div class="it"><b class="nt">${esc(p.nick)}</b><small>${esc(t("invited you to"))} ${esc(n.rname||"")}</small></div><button class="gbtn" onclick="document.getElementById('invpop').remove();enterRoom('${room}')">${esc(t("Join"))}</button><button class="ix" onclick="document.getElementById('invpop').remove()">✕</button>`;
  $("#app").appendChild(d); try{ playSnd&&playSnd("chime"); }catch(e){}
  setTimeout(()=>{ if(d.isConnected) d.remove(); },15000);
}
/* ===== room picture chosen by the owner (replaces the emoji icons) ===== */
const roomPhoto=r=>r&&typeof r.photo==="string"&&r.photo.startsWith("data:image/")?r.photo:null;
function roomAv(r){ const p=roomPhoto(r); return p?`<img src="${p}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block">`:`<span class="ri">${esc(((r&&r.name)||"?").trim().charAt(0).toUpperCase())}</span>`; }
async function makeRoomPhoto(file){
  let bmp; try{ bmp=await createImageBitmap(file); }catch(e){ const url=URL.createObjectURL(file); bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }
  const W=bmp.width, H=bmp.height, S0=300, tw=Math.min(W,H*1), th=tw; // square crop, centered
  const c=document.createElement("canvas"); c.width=c.height=S0; const x=c.getContext("2d");
  x.drawImage(bmp,(W-tw)/2,(H-th)/2,tw,th,0,0,S0,S0);
  let q=.85, url=c.toDataURL("image/jpeg",q); while(url.length>42000&&q>.35){ q-=.08; url=c.toDataURL("image/jpeg",q); }
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); return {url,blob};
}
async function screenRoomPhoto(blob){
  try{
    if(!S.sample||!S.sample.limits) return {ok:true};
    const lim=await S.sample.limits(); if(!lim||!lim.images) return {ok:true};
    const r=await S.sample(`You are screening a picture for a family-friendly social app's room cover. Approve it unless it contains nudity or sexual content, violence or gore, weapons, hate symbols, or phone numbers/contact details. Logos, art, landscapes, people and cartoons are fine. Reply with JSON only: {"ok": true or false, "reason": "one short sentence in ${LANGS[S.lang].full}"}`,{images:[blob],modelTier:"quick"});
    const m=(r.text||"").match(/\{[\s\S]*\}/); if(!m) return {ok:true}; const j=JSON.parse(m[0]); return {ok:!!j.ok,reason:String(j.reason||"")};
  }catch(e){ return {ok:true}; }
}
function pickRoomPhoto(mode,done){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; if(mode==="camera") inp.setAttribute("capture","environment");
  inp.style.display="none"; document.body.appendChild(inp);
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return; toast(t("Checking your photo..."));
    try{ const {url,blob}=await makeRoomPhoto(f), v=await screenRoomPhoto(blob);
      if(!v.ok) return toast("🚫 "+(v.reason||t("Photo not accepted")));
      done(url);
    }catch(e){ console.warn(e); toast(t("Couldn't read that image")); }
  };
  inp.click();
}
function hideSplash(){ $("#splash").classList.add("hide"); }

function subscribeAll(){
  S.db.collection("profiles").limit(500).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>m[d.id]={...d.data(),_id:d.id}); S.profiles=m; resolveVerified(); if(m[S.uid]&&S.me&&!S.me._local) {/* keep local copy authoritative */} render(); }, e=>console.warn(e));
  S.db.collection("rooms").orderBy("score","desc").limit(200).onSnapshot(s=>{ S.rooms=s.docs.map(d=>({id:d.id,...d.data()})); if(S.cur){ const r=S.rooms.find(x=>x.id===S.cur.id); if(r){ S.cur.data=r; if(isBannedIn(r,S.uid)){ toast(t("You were removed from this room")); leaveRoom(); } else { if(LV.on&&isMutedIn(r,S.uid)){ micOff(true); toast(t("You are muted in this room")); } renderRoomHead(); renderPK(); renderSeats(); } } else if(!S.local){ toast("This room was deleted"); leaveRoom(); } }
    if(S.pendingRoom&&S.me&&S.rooms.some(r=>r.id===S.pendingRoom)){ const id=S.pendingRoom; S.pendingRoom=null; enterRoom(id); }
    render(); }, e=>console.warn(e));
  S.db.collection("posts").orderBy("at","desc").limit(60).onSnapshot(s=>{ S.posts=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, e=>console.warn(e));
  S.db.collection("notifs").where("to","==",S.uid).limit(200).onSnapshot(s=>{ S.notifs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0)); try{inviteWatch()}catch(e){} render(); },()=>{});
  S.db.doc("system/announce").onSnapshot(s=>{ S.announce=s.exists?s.data():null; render(); },()=>{});
  S.db.collection("vipids").limit(1000).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ const v=d.data(); if(v&&v.sid) m[d.id]=String(v.sid); }); S.vipIds=m; render(); if(S.cur){ renderSeats(); renderMsgs(); } },()=>{});
  S.db.collection("grants").where("to","==",S.uid).limit(100).onSnapshot(s=>s.docs.forEach(claimGrant),()=>{});
  S.db.collection("gifts").where("to","==",S.uid).limit(1000).onSnapshot(s=>earnGifts(s.docs.map(d=>d.data())),()=>{});
  S.db.collection("dms").where("members","array-contains",S.uid).onSnapshot(s=>{ S.dms=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0)); render(); }, e=>console.warn(e));
}

function lobbyPresence(){
  try{
    S.room.onPeers(ch=>{ S.lobbyPeers=ch.peers; if(S.tab==="rooms"||S.tab==="home") render(); });
    S.room.presence({uid:S.uid, inRoom:null}).catch(()=>{});
  }catch(e){}
}
function roomCount(id){
  let n=0; for(const p of S.lobbyPeers){ if(p.presence && p.presence.inRoom===id) n++; }
  if (S.local){ const r=S.rooms.find(x=>x.id===id); n += (r&&r.demo?r.demo.length:0) + (S.cur&&S.cur.id===id?1:0); }
  return n;
}

  window.obPhoto=u=>{ name=$("#ob_n").value; st.country=$("#ob_c").value; st.ok=$("#ob_ok").checked; st.photo=u; draw(); };
  window.obLang=l=>{ name=$("#ob_n").value; st.country=$("#ob_c").value; st.ok=$("#ob_ok").checked; S.lang=l; try{localStorage.setItem("dk_lang",l)}catch(e){} applyDir(); _dnLang=null; draw(); };
  window.obDone=async()=>{
    const n=$("#ob_n").value.trim(); if(!n) return toast("Please enter a name");
    if(!$("#ob_ok").checked) return toast(t("Please accept the Community Guidelines"));
    S.me={nick:n.slice(0,20),av:st.av,c:st.c,country:$("#ob_c").value,lang:S.lang,dmPolicy:"all",blocked:[],bio:"",coins:5000,xp:0,following:[],giftsSent:0,gamesWon:0,lastDaily:"",spinDay:"",reads:{},sid:hashNum(S.uid),at:Date.now()};

    saving = S.db.doc("profiles/"+S.uid).set(body).catch(writeFail);

  <div class="rankrow">

    <button class="rk rkimg" title="Richest" onclick="openRankings('wealth')"><span class="rkb r2"></span><span class="rks nt">${topUser?esc(topUser[1].nick):"—"}</span></button>
    <button class="rk rkimg" title="Charm" onclick="openRankings('charm')"><span class="rkb r3"></span><span class="rks nt">${topUser?esc(topUser[1].nick):"—"}</span></button>
  </div>
  <div class="chips"><button class="chip ${S.country==="all"?"on":""}" onclick="S.country='all';render()">All</button>
    ${[...new Set([...TOP_COUNTRIES,...(S.country!=="all"?[S.country]:[])])].map(k=>`<button class="chip ${S.country===k?"on":""}" onclick="S.country='${k}';render()">${cflag(k)} <span class="nt">${esc(cname(k))}</span></button>`).join("")}
    <button class="chip" onclick="openCountryPicker(k=>{S.country=k;render()})">🌍 More</button></div>
  <div class="catrow"><button class="cat ${!S.cat||S.cat==="all"?"on":""}" onclick="S.cat='all';render()">✨ All</button>${ROOM_CATS.map(([k,e,n])=>`<button class="cat ${S.cat===k?"on":""}" onclick="S.cat='${k}';render()">${e} ${n}</button>`).join("")}</div>
  ${list.length?`<div class="grid2">${list.map(roomCard).join("")}</div>`:
    `<div class="empty"><div class="em">🏰</div>${S.roomsTab==="mine"?"You don't have a room yet":"No rooms found"}<br><br><button class="gbtn" onclick="openCreateRoom()">＋ Create a room</button></div>`}`;
}

function openCreateRoom(edit){

  const st={...r};
  const draw=()=>openModal(`
    <div class="rcover" style="background:${THEMES[st.theme]}${roomPhoto(st)?`;background-image:url(${roomPhoto(st)})!important;background-size:cover!important;background-position:center!important`:""};border-radius:16px;height:150px;margin-bottom:12px"></div>

    <div class="field"><span>${esc(t("Room picture"))}</span><div class="rpicbtns"><button class="gbtn" style="padding:8px 14px;font-size:13px" onclick="crPhoto('gallery')">🖼️ ${esc(t("Choose from gallery"))}</button><button class="gbtn dark" style="padding:8px 14px;font-size:13px" onclick="crPhoto('camera')">📷 ${esc(t("Take a photo"))}</button>${roomPhoto(st)?`<button class="gbtn dark" style="padding:8px 14px;font-size:13px;color:#ff8a8a" onclick="crSet('photo','')">🗑️ ${esc(t("Remove"))}</button>`:""}</div></div>
    <div class="field"><span>Theme</span><div class="pick">${THEMES.map((b,i)=>`<button class="swatch ${i===st.theme?"on":""}" style="background:${b}" onclick="crSet('theme',${i})"></button>`).join("")}</div></div>
    <div class="field"><span>Category</span><div class="catrow" style="padding:0;flex-wrap:wrap">${ROOM_CATS.map(([k,e,n])=>`<button class="cat ${k===(st.cat||"chat")?"on":""}" onclick="crSet('cat','${k}')">${e} ${n}</button>`).join("")}</div></div>
    <label class="field"><span>Country</span><select id="cr_c">${countryOptions(st.country)}</select></label>
    <label class="field"><span>Official announcement</span><textarea id="cr_a" maxlength="200">${esc(st.notice)}</textarea></label>
    <button class="gbtn" style="width:100%;padding:12px" onclick="crSave()">${edit?"Save":"Create room 🏰"}</button>
    ${edit?`<button style="width:100%;margin-top:10px;color:var(--red);padding:8px" onclick="deleteRoom()">🗑️ Delete room</button>`:""}`,{title:edit?"✏️ Edit room":"🏰 New room"});
  window.crSet=(k,v)=>{ st.name=$("#cr_n").value; st.notice=$("#cr_a").value; st.country=$("#cr_c").value; st[k]=v; draw(); };
  window.crPhoto=mode=>{ st.name=$("#cr_n").value; st.notice=$("#cr_a").value; st.country=$("#cr_c").value; pickRoomPhoto(mode,u=>{ st.photo=u; draw(); }); };
  window.crSave=async()=>{
    const name=$("#cr_n").value.trim(); if(!name) return toast("Enter a room name");
    if(!edit){ const d=dayStats(); if((d.rooms||0)>=3) return toast(t("You can create up to 3 rooms per day")); d.rooms=(d.rooms||0)+1; S.me.day=d; }
    const body={name,icon:st.icon||"🏰",photo:roomPhoto(st)||"",theme:st.theme,cat:st.cat||"chat",country:$("#cr_c").value,notice:$("#cr_a").value.trim().slice(0,200)};
    try{
      if(edit){ await S.db.doc("rooms/"+edit.id).update(body); closeModal(); toast("Saved ✓"); }

}
async function deleteRoom(){
  const r=S.cur&&S.cur.data; if(!r) return;

}
async function doDeleteRoom(){ const id=S.cur.id; closeModal(); try{ await S.db.doc("rooms/"+id).delete(); toast("Room deleted"); leaveRoom(); }catch(e){writeFail(e)} }

/* ----- inside a room ----- */
async function enterRoom(id){
  const r=S.rooms.find(x=>x.id===id); if(!r) return toast("Room not found");
  if(isBannedIn(r,S.uid)) return toast(t("You were removed from this room"));
  if(S.cur&&S.cur.id===id){ roomRestore(); return; }
  if (S.cur) await leaveRoom(true);
  S.cur={id,data:r,peers:[],msgs:[],unsub:[],named:null,seat:null,seen:new Set(),t0:Date.now()};
  const rv=$("#roomView"); rv.classList.add("show");
  rv.innerHTML=`
    <div class="bgfx" id="rbg"></div>
    <div class="rhead">
      <div class="rpill" id="rpill"></div>
      <div style="flex:1"></div>
      <button class="dkbtn pkhead" onclick="openPK()" title="PK">⚔️</button>
      <button class="dkbtn" id="sndbtn" onclick="toggleSound()" title="Sound">${S.sound?"🔊":"🔇"}</button>
      <button class="dkbtn" onclick="openInvite()" title="Invite">🔗</button>
      <button class="dkbtn" onclick="roomMenu(event)" title="Menu">⏻</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 0;position:relative">
      <button class="trophy" id="trophy" onclick="openRankings('rooms')"></button>
      <button class="onl" id="onl" onclick="openOnline()"></button>
    </div>
    <div id="pkbar"></div>
    <div class="seats" id="seats"></div>
    <div class="speakbar" id="speakbar"></div>
    <div class="chatwrap" id="chatwrap"><div class="msgs" id="msgs"></div></div>
    <div class="rbar">
      <button class="talkbtn" id="talkbtn" title="Mic">🎤</button>
      <input id="rin" maxlength="300" placeholder="Say something..." onkeydown="if(event.key==='Enter')sendRoomMsg()">
      <button class="rbtn" onclick="sendRoomMsg()">➤</button>
      <button class="rbtn" onclick="openVoiceHub()" title="Voice">🎵</button>
      <button class="rbtn gold" onclick="openGifts({kind:'room'})" title="Gift">🎁</button>
      <button class="rbtn" onclick="openFun()" title="Games">🎲</button>
    </div>`;
  renderRoomHead(); renderPK(); renderSeats(); setupTalk();
  clearInterval(S.pkTimer); S.pkTimer=setInterval(pkTick,1000);
  // messages
  const u=S.db.collection("rooms/"+id+"/msgs").orderBy("at","desc").limit(80).onSnapshot(s=>{
    if(!S.cur||S.cur.id!==id) return;
    const msgs=s.docs.map(d=>({id:d.id,...d.data()})).reverse();
    for(const m of msgs){
      if(!S.cur.seen.has(m.id) && m.at>S.cur.t0-2000){
        if(m.type==="gift") playGift(m);
        else if(m.type==="sfx") playSfx(m.sfx);
        else if(m.type==="sys" && m.join) showEntry(m.uid);
      }
      S.cur.seen.add(m.id);
    }
    S.cur.msgs=msgs; renderMsgs(); renderSeats();
  }, e=>console.warn(e));
  S.cur.unsub.push(u);
  // presence
  if (S.room){
    try{ S.room.presence({inRoom:id}).catch(()=>{}); }catch(e){}
    try{
      const nr=await S.room.join("r-"+id);
      if(!S.cur||S.cur.id!==id){ nr.leave(); return; }
      S.cur.named=nr;
      if(liveVoice()) lvJoin(id);
      nr.onPeers(ch=>{ if(S.cur&&S.cur.id===id){ S.cur.peers=ch.peers; renderSeats(); renderRoomHead(); if(liveVoice()) lvSync(ch.peers); } });
      nr.presence({uid:S.uid,seat:null}).catch(()=>{});
    }catch(e){ console.warn(e); }
  }
  // recent + mission
  const rec=[id,...(S.me.recent||[]).filter(x=>x!==id)].slice(0,12);
  S.me.recent=rec; bump("joins");
  postRoom({type:"sys",text:"joined the room",join:1});
  setHash("room-"+id);
}
async function leaveRoom(silent){
  if(!S.cur) return;
  if(typeof lvLeave==="function") lvLeave();
  clearInterval(S.pkTimer); if(CR.open) crashClose(); if(L7.open) luckyClose();
  const c=S.cur; S.cur=null; { const bb=$("#rbub"); if(bb) bb.remove(); const mm=$("#rmn"); if(mm) mm.remove(); }
  c.unsub.forEach(f=>{try{f()}catch(e){}});
  try{ c.named && await c.named.leave(); }catch(e){}
  try{ S.room && S.room.presence({inRoom:null}).catch(()=>{}); }catch(e){}
  if(!silent){ $("#roomView").classList.remove("show"); $("#roomView").innerHTML=""; setHash(""); render(); }
}
function shareRoom(){
  const t=`Join “${S.cur.data.name}” on DANGI KURDISTAN — Room ID: ${roomDispId(S.cur.data)}`;

function roomPeople(){
  // unique by uid from named-room peers (+ demo in local)
  const out=new Map();
  for(const p of (S.cur.peers||[])){ const uid=p.by||(p.presence&&p.presence.uid); if(!uid) continue; const prev=out.get(uid); if(!prev||(p.presence&&p.presence.seat!=null)) out.set(uid,{uid,seat:p.presence?p.presence.seat:null,mic:!!(p.presence&&p.presence.mic),me:p.isMe}); }
  if (!S.room || !S.cur.named) out.set(S.uid,{uid:S.uid,seat:S.cur.seat,mic:LV.on,me:true});
  if (S.local && S.cur.data.demo) S.cur.data.demo.forEach(d=>out.set(d.uid,{uid:d.uid,seat:d.seat,me:false}));
  return [...out.values()];
}

    else if((S.cur.data.lockedSeats||[]).includes(i)) h+=`<button class="seat" onclick="${isRoomAdmin(S.uid)?`openSeatMenu(${i})`:`toast(t('This seat is locked'))`}"><div class="s" style="opacity:.6">🔒</div><span class="n">${i+1}</span></button>`;

function gTTT(){
  let b=Array(9).fill(""), over=false;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=(bd,p)=>L.some(l=>l.every(i=>bd[i]===p));
  const draw=(msg="You are ❌ — your turn")=>openModal(`<div class="center" id="tmsg">${msg}</div><div class="ttt">${b.map((c,i)=>`<button onclick="tPlay(${i})" style="color:${c==="X"?"#e0393e":"#1c7ed6"}">${c==="X"?"✕":c==="O"?"○":""}</button>`).join("")}</div><div class="center"><button class="gbtn" onclick="gTTT()">New game</button></div>`,{title:"❌ Tic-Tac-Toe",dark:gDark()});
  const ai=()=>{ const free=b.map((c,i)=>c?null:i).filter(x=>x!==null);
    for(const p of ["O","X"]) for(const i of free){ const t=[...b]; t[i]=p; if(win(t,p)) return i; }
    if(!b[4]) return 4; const corners=[0,2,6,8].filter(i=>!b[i]); if(corners.length&&Math.random()<.7) return pick(corners); return pick(free); };
  window.tPlay=i=>{ if(over||b[i]) return; b[i]="X";
    if(win(b,"X")){ over=true; draw("🎉 You won! +100"); return gameEnd(true,100,"Tic-Tac-Toe"); }
    if(b.every(Boolean)){ over=true; draw("It's a draw 🤝 +20"); addCoins(20,"draw"); return bump("games"); }
    b[ai()]="O";
    if(win(b,"O")){ over=true; draw("😅 You lost, try again"); return bump("games"); }
    if(b.every(Boolean)){ over=true; draw("It's a draw 🤝 +20"); addCoins(20,"draw"); return bump("games"); }
    draw(); };
  draw();
}

S.sound = (()=>{ try{ return localStorage.getItem("dk_snd")!=="0"; }catch(e){ return true; } })();
let AC=null, MASTER=null, NOISE=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MASTER=AC.createGain(); MASTER.gain.value=.8; MASTER.connect(AC.destination); }catch(e){ return null; } }
  if(AC.state==="suspended") AC.resume().catch(()=>{});
  return AC;
}
document.addEventListener("pointerdown",()=>ac(),{passive:true});
function toggleSound(){ S.sound=!S.sound; try{localStorage.setItem("dk_snd",S.sound?"1":"0")}catch(e){} const b=$("#sndbtn"); if(b) b.textContent=S.sound?"🔊":"🔇"; toast(S.sound?"🔊 Sound on":"🔇 Sound off"); if(S.sound) playSnd("chime"); if(typeof lvSoundSync==="function") lvSoundSync(); }
function tone(f,t,d,type="sine",vol=.2,f2){ const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(MASTER); o.start(t); o.stop(t+d+.05); }
function noise(t,d,vol=.3,ft="bandpass",f=1000,f2,q=1){
  if(!NOISE){ NOISE=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const a=NOISE.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1; }

async function sendGift(ctx,to,g,qty){
  const cost=g.c*qty;
  if((S.me.coins||0)<cost) return toast("Not enough coins — claim rewards or play games");
  if(to===S.uid) return toast("You can't send a gift to yourself");
  if(!allow("gift",10,10000)) return;
  const d=dayStats(); d.gifts=(d.gifts||0)+1;
  saveMe({coins:S.me.coins-cost,giftsSent:(S.me.giftsSent||0)+cost,xp:(S.me.xp||0)+Math.ceil(cost/5),day:d});
  S.db.collection("gifts").add({from:S.uid,to:to||"room",gift:g.k,qty,c:cost,room:ctx.kind==="room"&&S.cur?S.cur.id:null,at:Date.now()}).catch(()=>{});
  if(to && to!=="room") notify(to,"gift",{gift:g.k,qty});
  const toName = to==="room"||!to ? "the room" : prof(to).nick;
  if(ctx.kind==="room" && S.cur){
    await postRoom({type:"gift",gift:g.k,qty,to:to||"room",text:`sent ${g.n} to ${toName}`});
    pkAddScore(to,cost);
    S.db.doc("rooms/"+S.cur.id).update({score:(S.cur.data.score||0)+cost}).catch(()=>{});
  } else if(ctx.kind==="dm" && S.dm){
    const at=Date.now();
    try{ await S.db.collection("dms/"+S.dm.key+"/msgs").add({uid:S.uid,type:"gift",gift:g.k,qty,text:"",at});
         await S.db.doc("dms/"+S.dm.key).set({members:[S.uid,S.dm.other],last:"🎁 "+g.n+(qty>1?" x"+qty:""),at,by:S.uid}); }catch(e){writeFail(e)}
  } else {
    playGift({uid:S.uid,gift:g.k,qty,to});
    toast(`${g.e} ${g.n} sent to ${toName}`);
  }
}

const gq=[]; let gBusy=false; const combos={};
function playGift(m){
  const g=giftOf(m.gift), qty=Math.max(1,Math.min(999,+m.qty||1));

function combo(uid,g,qty,to,preview){

  if(c){ c.n+=qty; const x=c.el.querySelector(".x"); x.textContent="x"+c.n; x.classList.remove("bump"); void x.offsetWidth; x.classList.add("bump"); clearTimeout(c.to); c.to=setTimeout(()=>endCombo(key),3500); return; }
  const used=new Set(Object.values(combos).map(v=>v.slot)); let slot=0; while(used.has(slot)&&slot<3) slot++; if(slot>=3) slot=0;
  const p=prof(uid), tn = preview?"Preview":to&&to!=="room"?"to "+(prof(to).nick||""):"";
  const el=document.createElement("div"); el.className="combo"; el.style.top=(30+slot*9)+"%";

  $("#comboLayer").appendChild(el);

  const it=gq.shift(); if(!it){ gBusy=false; return; } gBusy=true;
  const {g,m,qty}=it, dur=g.t==="l"?5.2:2.8;
