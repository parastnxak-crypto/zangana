  kmr:{iq:"Iraq",ir:"Îran",tr:"Tirkiye",sy:"Sûriye",de:"Almanya",gb:"Brîtanya",se:"Swêd",nl:"Holanda",fr:"Fransa",us:"DYA",ae:"Mîrnişînên Erebî",sa:"Erebistana Siûdî",at:"Awistirya",be:"Belçîka",ch:"Swîsre",dk:"Danîmarka",no:"Norwêc",fi:"Fînlenda",ru:"Rûsya",am:"Ermenistan",ge:"Gurcistan",gr:"Yewnanistan",it:"Îtalya",es:"Spanya",jo:"Urdun",lb:"Libnan",eg:"Misir"}};
function cname(k){
  if(k==="ku") return t("Kurdistan"); if(!k||k==="other") return t("Other");
  if(CN_KU[S.lang]&&CN_KU[S.lang][k]) return CN_KU[S.lang][k];
  try{ if(_dnLang!==S.lang){ _dn=new Intl.DisplayNames([S.lang==="ckb"?"ckb":S.lang,"en"],{type:"region"}); _dnLang=S.lang; } return _dn.of(k.toUpperCase())||k.toUpperCase(); }catch(e){ return k.toUpperCase(); }
}
function cflag(k){ if(k==="ku") return "☀️"; if(!k||k.length!==2) return "🌍"; return String.fromCodePoint(...k.toUpperCase().split("").map(c=>127397+c.charCodeAt(0))); }
function countryOptions(sel){
  const list=COUNTRY_CODES.map(k=>[k,cname(k)]); const head=list[0]; const rest=list.slice(1).sort((a,b)=>a[1].localeCompare(b[1]));
  return [head,...rest].map(([k,n])=>`<option value="${k}" ${k===sel?"selected":""}>${cflag(k)} ${esc(n)}</option>`).join("");
}
function detectCountry(){
  const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||"");
  if(S.lang==="ckb"||S.lang==="kmr") return "ku";
  const map={"Asia/Baghdad":"ku","Asia/Tehran":"ir","Europe/Istanbul":"tr","Asia/Damascus":"sy","Europe/Berlin":"de","Europe/London":"gb","Europe/Stockholm":"se","Europe/Amsterdam":"nl","Europe/Paris":"fr","Asia/Dubai":"ae","Asia/Riyadh":"sa"};
  if(map[tz]) return map[tz];
  const r=((navigator.language||"").split("-")[1]||"").toLowerCase(); return ISO.includes(r)?r:"ku";
}
function openCountryPicker(onPick){
  let q="";
  const draw=()=>{ const list=COUNTRY_CODES.filter(k=>!q||cname(k).toLowerCase().includes(q.toLowerCase())||k.includes(q.toLowerCase()));
    $("#cplist").innerHTML=list.map(k=>`<button class="lb" style="width:100%" onclick="cpPick('${k}')"><span style="font-size:22px">${cflag(k)}</span><b class="nt" style="flex:1;text-align:start">${esc(cname(k))}</b></button>`).join(""); };
  openModal(`<input id="cpq" class="field" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px" placeholder="Search country..." oninput="cpQ(this.value)"><div id="cplist" style="max-height:55vh;overflow:auto"></div>`,{title:"🌍 Countries"});
  window.cpQ=v=>{q=v;draw()}; window.cpPick=k=>{ closeModal(); onPick(k); }; draw();
}

/* ---------- safety: block, report, filter ---------- */
const BAD=["fuck","shit","bitch","bastard","asshole","whore","slut","dick","pussy","کس","شرموط","عاهرة","قحبة","زب","قەحپە","گو بخۆ","orospu","siktir","amk","piç","qehpe"];
S.filterBad=(()=>{ try{ return localStorage.getItem("dk_filter")!=="0"; }catch(e){ return true; } })();
function clean(s){ s=String(s??""); if(!S.filterBad) return s; for(const w of BAD){ const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"); s=s.replace(re,m=>"*".repeat(m.length)); } return s; }
const isBlocked=uid=>!!(S.me&&(S.me.blocked||[]).includes(uid));
const blocksMe=uid=>((prof(uid).blocked)||[]).includes(S.uid);
function toggleBlock(uid){
  const b=new Set(S.me.blocked||[]); const was=b.has(uid);
  was?b.delete(uid):b.add(uid);
  const f=new Set(S.me.following||[]); if(!was) f.delete(uid);
  saveMe({blocked:[...b],following:[...f]}); closeModal(); toast(was?t("Unblocked"):t("Blocked — you won't see their messages"));
}
const REPORT_REASONS=["Spam","Fake or offensive profile photo","Harassment or bullying","Hate speech","Nudity or sexual content","Violence or threats","Scam or fraud","Underage user","Other"];
function openReport(kind,target,label){
  let reason=0;
  const draw=()=>openModal(`<p style="margin:0 0 10px;opacity:.8">${esc(t("Why are you reporting this?"))} <b class="nt">${esc(label||"")}</b></p>
    ${REPORT_REASONS.map((r,i)=>`<button class="lb" style="width:100%" onclick="rpSel(${i})"><span style="font-size:18px">${i===reason?"🔘":"⚪"}</span><span style="flex:1;text-align:start">${r}</span></button>`).join("")}
    <label class="field" style="margin-top:10px"><span>Details (optional)</span><textarea id="rpn" maxlength="300"></textarea></label>
    <button class="gbtn" style="width:100%;padding:12px" onclick="rpSend()">Send report</button>`,{title:"🚩 Report",dark:!!S.cur});
  window.rpSel=i=>{ const n=$("#rpn").value; reason=i; draw(); $("#rpn").value=n; };
  window.rpSend=async()=>{
    if(!allow("report",5,864e5)) return;
    const item={kind,target,label:String(label||"").slice(0,80),reason:REPORT_REASONS[reason],note:$("#rpn").value.trim().slice(0,300),room:S.cur?S.cur.id:null,at:Date.now()};
    closeModal();
    try{ const ref=S.db.doc("reports/"+S.uid); const s=await ref.get(); const items=(s.exists&&s.data().items||[]).slice(-29); items.push(item); await ref.set({by:S.uid,items,at:Date.now()}); toast(t("Thanks — our team will review it")); }
    catch(e){ writeFail(e); }
  };
  draw();
}

  const agg={};
  if(tab==="rooms"){
    if(period==="all") S.rooms.forEach(r=>agg[r.id]=r.score||0); else gifts.forEach(g=>{ if(g.room) agg[g.room]=(agg[g.room]||0)+(+g.c||0); });
  } else if(tab==="wealth"&&period==="all"){ Object.entries(S.profiles).forEach(([id,p])=>{ if(p.giftsSent) agg[id]=p.giftsSent; }); }
  else gifts.forEach(g=>{ const k=tab==="wealth"?g.from:g.to; if(k&&k!=="room") agg[k]=(agg[k]||0)+(+g.c||0); });
  const rows=Object.entries(agg).filter(([id])=>tab==="rooms"?S.rooms.some(r=>r.id===id):!isBlocked(id)).sort((a,b)=>b[1]-a[1]).slice(0,50);
  const item=id=>tab==="rooms"?(()=>{ const r=S.rooms.find(x=>x.id===id); return {name:r.name,av:`<div style="width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:${THEMES[r.theme||0]}">${esc(r.icon)}</div>`,click:`closeModal();enterRoom('${id}')`}; })()
    :{name:prof(id).nick,av:avHTML(prof(id),44),click:`openUser('${id}')`,vip:vipBadge(prof(id))};

  openModal(head+podium+(rows.slice(3).map(([id,v],i)=>{ const it=item(id); return `<button class="lb" style="width:100%" onclick="${it.click}"><span class="rk2">${i+4}</span>${it.av}<b class="nt" style="flex:1;text-align:start">${esc(it.name)} ${it.vip||""}</b><span>${tab==="charm"?"💎":"🪙"} ${fmt(v)}</span></button>`; }).join("")||(rows.length?"":`<div class="empty"><div class="em">🏆</div>No one yet — send a gift to get on the board!</div>`)),{title:"🏆 Rankings"});

const ROOM_CATS=[["chat","💬","Chat"],["music","🎵","Music"],["games","🎮","Games"],["poetry","📜","Poetry"],["friends","🤝","Friends"],["learn","📚","Learning"],["news","📰","News"]];
const isRoomAdmin=(uid,r)=>{ r=r||(S.cur&&S.cur.data); return !!r&&(uid===r.ownerId||(r.admins||[]).includes(uid)); };
const isMutedIn=(r,uid)=>((r&&r.mutes||{})[uid]||0)>Date.now();
const isBannedIn=(r,uid)=>((r&&r.bans||{})[uid]||0)>Date.now();
async function modAction(kind,uid){
  const r=S.cur.data, ref=S.db.doc("rooms/"+S.cur.id), nick=prof(uid).nick; closeModal();
  try{
    if(kind==="mute"){ await ref.update({mutes:{[uid]:Date.now()+10*60e3}}); postRoom({type:"sys",text:"was muted for 10 minutes",target:uid}); }
    if(kind==="unmute"){ await ref.update({mutes:{[uid]:0}}); }
    if(kind==="kick"){ await ref.update({bans:{[uid]:Date.now()+60*60e3}}); postRoom({type:"sys",text:"was removed from the room",target:uid}); }
    if(kind==="admin"){ const a=new Set(r.admins||[]); a.add(uid); await ref.update({admins:[...a]}); notify(uid,"admin",{room:S.cur.id}); }
    if(kind==="unadmin"){ const a=new Set(r.admins||[]); a.delete(uid); await ref.update({admins:[...a]}); }
    toast(t("Done")+" ✓ "+nick);
  }catch(e){ writeFail(e); }
}

async function makePhoto(file){
  let bmp; try{ bmp=await createImageBitmap(file); }catch(e){ const url=URL.createObjectURL(file); bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }
  const W=bmp.width, H=bmp.height, side=Math.min(W,H), SZ=256;
  const c=document.createElement("canvas"); c.width=c.height=SZ; const x=c.getContext("2d");
  x.drawImage(bmp,(W-side)/2,(H-side)/2,side,side,0,0,SZ,SZ);
  let q=.85, url=c.toDataURL("image/jpeg",q); while(url.length>60000&&q>.4){ q-=.1; url=c.toDataURL("image/jpeg",q); }
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  return {url,blob};
}

/* ---------- anti-spam ---------- */
const RL={};
function allow(key,max,ms,silent){
  const now=Date.now(), a=(RL[key]=(RL[key]||[]).filter(x=>now-x<ms));
  if(a.length>=max){ if(!silent) toast(t("Slow down — you're sending too fast")); return false; }
  a.push(now); return true;
}
function spamOK(text,where,max=5,ms=10000){
  if(!allow(where,max,ms)) return false;
  const norm=String(text).trim().toLowerCase().replace(/\s+/g," ");
  const last=RL["last_"+where]||[];
  if(norm.length>1&&last.includes(norm)){ toast(t("You already sent that message")); return false; }
  RL["last_"+where]=[norm,...last].slice(0,3);
  if(/(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|io|me|ly|xyz)\b|t\.me\/|wa\.me\/)/i.test(text)&&(Date.now()-(S.me.at||0)<864e5||level(S.me.xp)<3)){ toast(t("New accounts can't send links yet")); return false; }
  if(/(.)\1{14,}/.test(text)){ toast(t("You already sent that message")); return false; }
  return true;
}

function fireDB(fs){
  const wrapDoc=r=>({id:r.id,path:r.path,
    get:()=>r.get(), set:d=>r.set(d), update:d=>r.set(d,{merge:true}), delete:()=>r.delete(),
    onSnapshot:(n,e)=>r.onSnapshot(n,e), collection:p=>wrapCol(r.collection(p)), acquire:async()=>({acquired:true})});
  const wrapCol=c=>({path:c.path, doc:id=>wrapDoc(id?c.doc(id):c.doc()), add:async d=>wrapDoc(await c.add(d)),
    where:(...a)=>c.where(...a), orderBy:(...a)=>c.orderBy(...a), limit:n=>c.limit(n), get:()=>c.get(), onSnapshot:(n,e)=>c.onSnapshot(n,e)});
  return {doc:p=>wrapDoc(fs.doc(p)), collection:p=>wrapCol(fs.collection(p))};
}

/* presence (who is online, who sits on which seat) stored in Firestore */
function fireRoom(fs,uid){
  const ref=fs.doc("presence/"+uid); const mine={uid,inRoom:null,seat:null}; let all=[];
  const lobbyCbs=new Set(), roomCbs=new Map();
  const push=()=>ref.set({...mine,at:Date.now()}).catch(()=>{});
  const peers=f=>{ const now=Date.now(); return all.filter(p=>p&&p.uid&&(p.uid===uid||now-(p.at||0)<150000)).map(p=>p.uid===uid?{...p,...mine}:p).filter(f)
    .map(p=>({by:p.uid,peer:p.uid,isMe:p.uid===uid,sameTab:p.uid===uid,kind:"viewer",guest:false,presence:p,updatedAt:p.at||0})); };
  const emit=()=>{ const lp=peers(()=>true); lobbyCbs.forEach(f=>f({peers:lp,joined:[],left:[],updated:[]}));
    roomCbs.forEach((set,id)=>{ const rp=peers(p=>p.inRoom===id); set.forEach(f=>f({peers:rp,joined:[],left:[],updated:[]})); }); };
  fs.collection("presence").limit(500).onSnapshot(s=>{ all=s.docs.map(d=>d.data()); if(!all.some(p=>p.uid===uid)) all.push({...mine,at:Date.now()}); emit(); },()=>{});
  setInterval(()=>{ push(); emit(); },60000);
  window.addEventListener("pagehide",()=>{ ref.set({uid,inRoom:null,seat:null,at:0}).catch(()=>{}); });
  push();
  const set=(patch)=>{ Object.assign(mine,patch); push(); emit(); return Promise.resolve(); };
  return {
    onPeers(f){ lobbyCbs.add(f); setTimeout(emit,0); return ()=>lobbyCbs.delete(f); },
    presence:set, connected:()=>true,
    async join(name){
      const id=name.replace(/^r-/,""); mine.inRoom=id; push(); const cbs=new Set(); roomCbs.set(id,cbs);
      return { name, presence:set, connected:()=>true,
        onPeers(f){ cbs.add(f); setTimeout(emit,0); return ()=>cbs.delete(f); },
        async leave(){ roomCbs.delete(id); mine.seat=null; if(mine.inRoom===id) mine.inRoom=null; push(); emit(); } };
    }
  };
}

/* ================================================================
   LIVE VOICE — tap 🎤 to turn your mic on, tap again to turn it off.
   Everyone in the room hears you live (WebRTC, peer to peer).
   Signaling goes through Firestore: rtc/{room}/sig
   ================================================================ */
const LV={on:false,stream:null,pcs:new Map(),room:null,unsub:null,audios:new Map(),meters:new Map(),levels:new Map(),speaking:new Set(),timer:null,needTap:false};
const LV_ICE={iceServers:[
  {urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun2.l.google.com:19302"]},
  {urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}]};
const liveVoice=()=>!!(S.fb&&window.RTCPeerConnection&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);

/* signaling bus (replaceable for tests) */
const lvBus={
  listen(room,cb){ return S.fb.fs.collection(`rtc/${room}/sig`).where("to","==",S.uid).onSnapshot(s=>s.docChanges().forEach(ch=>{
      if(ch.type!=="added") return; const d=ch.doc.data(); ch.doc.ref.delete().catch(()=>{}); if(Date.now()-(d.at||0)<90000) cb(d); }),e=>console.warn("sig",e)); },
  send(room,to,type,sdp){ return S.fb.fs.collection(`rtc/${room}/sig`).add({from:S.uid,to,type,sdp:JSON.stringify(sdp),at:Date.now()}).catch(e=>console.warn("sig send",e)); }
};

function lvJoin(room){
  if(!liveVoice()) return; lvLeave(true);
  LV.room=room; LV.unsub=lvBus.listen(room,d=>lvSignal(d).catch(e=>console.warn("lv",e)));
  clearInterval(LV.timer); LV.timer=setInterval(lvTick,350);
}
function lvLeave(keepUi){
  if(LV.on) micOff(true);
  for(const id of [...LV.pcs.keys()]) lvDrop(id);
  if(LV.unsub){ try{LV.unsub()}catch(e){} LV.unsub=null; }
  clearInterval(LV.timer); LV.room=null; LV.speaking.clear(); LV.needTap=false;
}
function lvSync(peers){
  if(!LV.room) return;
  const ids=new Set((peers||[]).map(p=>p.by||(p.presence&&p.presence.uid)).filter(id=>id&&id!==S.uid));
  for(const id of ids) if(!LV.pcs.has(id)&&S.uid<id) lvCall(id).catch(e=>console.warn("lv call",e));
  for(const id of [...LV.pcs.keys()]) if(!ids.has(id)) lvDrop(id);
}
function lvNewPc(id){
  const pc=new RTCPeerConnection(LV_ICE);
  const o={pc,tr:null,id,at:Date.now()};
  pc.ontrack=e=>lvPlay(id,e.streams&&e.streams[0]||new MediaStream([e.track]));
  pc.onconnectionstatechange=()=>{ if(pc.connectionState==="failed"){ lvDrop(id); setTimeout(()=>{ if(S.cur&&LV.room) lvSync(S.cur.peers||[]); },2500); } };
  LV.pcs.set(id,o); return o;
}
function lvGathered(pc){ return new Promise(r=>{ if(pc.iceGatheringState==="complete") return r(); const t=setTimeout(r,2500); pc.addEventListener("icegatheringstatechange",()=>{ if(pc.iceGatheringState==="complete"){ clearTimeout(t); r(); } }); }); }
async function lvCall(id){
  const o=lvNewPc(id);
  o.tr=o.pc.addTransceiver("audio",{direction:"sendrecv"});
  if(LV.on&&LV.stream) await o.tr.sender.replaceTrack(LV.stream.getAudioTracks()[0]);
  await o.pc.setLocalDescription(await o.pc.createOffer());
  await lvGathered(o.pc);
  lvBus.send(LV.room,id,"offer",o.pc.localDescription.toJSON());
}
async function lvSignal(d){
  if(!LV.room||!d||!d.from||d.from===S.uid) return;
  const sdp=JSON.parse(d.sdp);
  if(d.type==="offer"){
    if(LV.pcs.has(d.from)) lvDrop(d.from);
    const o=lvNewPc(d.from);
    await o.pc.setRemoteDescription(sdp);
    o.tr=o.pc.getTransceivers()[0]; if(o.tr) o.tr.direction="sendrecv";
    if(o.tr&&LV.on&&LV.stream) await o.tr.sender.replaceTrack(LV.stream.getAudioTracks()[0]);
    await o.pc.setLocalDescription(await o.pc.createAnswer());
    await lvGathered(o.pc);
    lvBus.send(LV.room,d.from,"answer",o.pc.localDescription.toJSON());
  } else if(d.type==="answer"){
    const o=LV.pcs.get(d.from); if(o&&o.pc.signalingState==="have-local-offer") await o.pc.setRemoteDescription(sdp);
  }
}
function lvDrop(id){
  const o=LV.pcs.get(id); if(o){ try{o.pc.close()}catch(e){} LV.pcs.delete(id); }
  const a=LV.audios.get(id); if(a){ a.srcObject=null; a.remove(); LV.audios.delete(id); }
  const m=LV.meters.get(id); if(m){ try{m.src.disconnect()}catch(e){} LV.meters.delete(id); }
  LV.levels.delete(id);
}
function lvPlay(id,stream){
  let a=LV.audios.get(id);
  if(!a){ a=document.createElement("audio"); a.autoplay=true; a.setAttribute("playsinline",""); a.style.display="none"; document.body.appendChild(a); LV.audios.set(id,a); }
  if(a.srcObject!==stream) a.srcObject=stream;
  a.muted=!S.sound;
  const p=a.play(); if(p&&p.catch) p.catch(()=>{ LV.needTap=true; lvTapUi(); });
  lvMeter(id,stream);
}
function lvTapUi(){
  if(!LV.needTap||$("#lvtap")||!$("#roomView").classList.contains("show")) return;
  const b=document.createElement("button"); b.id="lvtap"; b.className="lvtap"; b.textContent="🔊 "+t("Tap to hear the voices");
  b.onclick=()=>{ LV.audios.forEach(a=>a.play().catch(()=>{})); ac(); LV.needTap=false; b.remove(); };
  $("#roomView").appendChild(b);
}
function lvMeter(id,stream){
  const c=ac(); if(!c||LV.meters.has(id)) return;
  try{ const src=c.createMediaStreamSource(stream), an=c.createAnalyser(), z=c.createGain(); an.fftSize=512; z.gain.value=0; src.connect(an); an.connect(z); z.connect(c.destination); LV.meters.set(id,{src,an,buf:new Float32Array(an.fftSize)}); }catch(e){ console.warn("meter",e); }
}
let lvTickBusy=false;
async function lvTick(){
  if(lvTickBusy) return; lvTickBusy=true;
  try{
    const now=Date.now(), TH=0.01;
    // remote + local levels from WebRTC stats (works on every browser, no audio graph needed)
    for(const [id,o] of LV.pcs){
      try{ const st=await o.pc.getStats(); st.forEach(x=>{
        if(x.type==="inbound-rtp"&&x.kind==="audio"&&(x.audioLevel||0)>TH) LV.levels.set(id,now);
        if(LV.on&&x.type==="media-source"&&x.kind==="audio"&&(x.audioLevel||0)>TH) LV.levels.set("me",now);
      }); }catch(e){}
    }
    // fallback analyser (used when you are alone in the room)
    LV.meters.forEach((m,id)=>{ m.an.getFloatTimeDomainData(m.buf); let s=0; for(const v of m.buf) s+=v*v; if(Math.sqrt(s/m.buf.length)>0.012) LV.levels.set(id,now); });
    const set=new Set(); LV.levels.forEach((ts,id)=>{ if(now-ts<700&&(id!=="me"||LV.on)) set.add(id==="me"?S.uid:id); });
    const changed=set.size!==LV.speaking.size||[...set].some(x=>!LV.speaking.has(x));
    if(changed){ LV.speaking=set; if(S.cur) renderSeats(); }
  } finally { lvTickBusy=false; }
}
async function micToggle(){ return LV.on?micOff():micOn(); }
async function micOn(){
  if(!S.cur) return;
  if(isMutedIn(S.cur.data,S.uid)) return toast(t("You are muted in this room"));
  if(!onSeat()) return toast("🪑 "+t("Sit on a seat first to talk"));
  try{ LV.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ return toast("🎤 "+t("Allow microphone access in your browser to talk")); }
  if(!onSeat()){ LV.stream.getTracks().forEach(t=>t.stop()); LV.stream=null; return; }
  LV.on=true;
  const tk=LV.stream.getAudioTracks()[0];
  LV.pcs.forEach(o=>{ if(o.tr) o.tr.sender.replaceTrack(tk).catch(()=>{}); });
  const m=LV.meters.get("me"); if(m){ try{m.src.disconnect()}catch(e){} LV.meters.delete("me"); }
  lvMeter("me",LV.stream);
  if(S.cur.named) S.cur.named.presence({mic:true}).catch(()=>{});
  micUi(); renderSeats(); toast("🎙️ "+t("Mic on — everyone in the room can hear you"));
}
function micOff(silent){
  LV.on=false;
  LV.pcs.forEach(o=>{ if(o.tr) o.tr.sender.replaceTrack(null).catch(()=>{}); });
  if(LV.stream){ LV.stream.getTracks().forEach(t=>t.stop()); LV.stream=null; }
  const m=LV.meters.get("me"); if(m){ try{m.src.disconnect()}catch(e){} LV.meters.delete("me"); }
  LV.levels.delete("me");
  if(S.cur&&S.cur.named) S.cur.named.presence({mic:false}).catch(()=>{});
  micUi(); if(S.cur) renderSeats(); if(!silent) toast("🔇 "+t("Mic off"));
}
function onSeat(){ if(!S.cur) return false; const me=roomPeople().find(p=>p.uid===S.uid); return !!(me&&me.seat!=null); }
function micUi(){ const b=$("#talkbtn"); if(b){ const tm=pkActive()?pkTeamOf(S.uid):null; b.classList.toggle("team-blue",tm==="blue"); b.classList.toggle("team-red",tm==="red"); } if(!b||!liveVoice()) return; b.style.opacity=(LV.on||onSeat())?"1":".55"; b.classList.toggle("live",LV.on); b.classList.toggle("off",!LV.on); b.textContent=LV.on?"🎙️":"🎤"; b.title=LV.on?t("Turn mic off"):t("Turn mic on"); }
function lvSoundSync(){ LV.audios.forEach(a=>a.muted=!S.sound); }
